<style>
:root{
  --navy:#123a63;--blue:#1f78c1;--purple:#6a2c91;--teal:#0e8a9d;--gold:#b7791f;--slate:#5f6f80;
  --ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f4f6fb;--ok:#15803d;--okb:#ecfdf5;--wip:#b45309;--wipb:#fffbeb;
  --d1:#1f78c1;--d2:#6a2c91;--d3:#0e8a9d;--d4:#b7791f;
  --r:18px;--sh:0 8px 28px rgba(18,58,99,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}
button{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* شريط النموذج */
.cm-demo{background:#fef3c7;border-bottom:2px solid #f59e0b;color:#78350f;font-size:13px;font-weight:700;padding:6px 14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.cm-demo.live{background:#e0f2fe;border-color:#38bdf8;color:#0c4a6e}
.cm-demo label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;background:#fff;border:1px solid currentColor;border-radius:999px;padding:1px 12px}
/* الترويسة */
.cm-hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#123a63 0%,#2a3a8c 48%,#5b2a86 100%)}
.cm-hero::before,.cm-hero::after{content:"";position:absolute;width:420px;height:420px;border:34px solid rgba(255,255,255,.07);transform:rotate(45deg);inset-inline-end:-120px;top:-170px;border-radius:34px;pointer-events:none}
.cm-hero::after{width:300px;height:300px;border-color:rgba(130,170,255,.10);inset-inline-end:40px;top:-120px}
.cm-hero .in{position:relative;max-width:1280px;margin:0 auto;padding:16px 20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cm-logos{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.cm-logos img{height:62px;width:auto;display:block}
.cm-logos .sep{width:1px;height:46px;background:var(--line)}
.cm-ttl h1{margin:0;font-size:25px;font-weight:900;line-height:1.3}
.cm-ttl p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.cm-tools{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm-pill{display:inline-flex;gap:6px;align-items:center;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none}
.cm-pill:hover{background:rgba(255,255,255,.24)}
.cm-pill.ro{cursor:default;background:rgba(0,0,0,.18)}
/* المحتوى */
.cm-wrap{max-width:1280px;margin:0 auto;padding:18px 20px 70px}
.cm-bc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut);font-weight:700;margin:0 0 12px}
.cm-bc a{text-decoration:none;color:var(--blue);cursor:pointer}
.cm-bc a:hover{text-decoration:underline}
.cm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.cm-k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:var(--sh)}
.cm-k .l{font-size:12.5px;color:var(--mut);font-weight:800}
.cm-k .v{font-size:26px;font-weight:900;direction:ltr;text-align:start;line-height:1.3}
.cm-h2{display:flex;gap:10px;align-items:center;margin:20px 0 10px;font-size:19px;font-weight:900}
.cm-h2 small{color:var(--mut);font-weight:700;font-size:13px}
.cm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cm-grid.dom{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
/* بطاقة مجال */
.cm-dom{--c:var(--d1);position:relative;text-align:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden;border-top:7px solid var(--c)}
.cm-dom::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-40px;width:130px;height:130px;border:16px solid var(--c);opacity:.07;transform:rotate(45deg);border-radius:18px}
.cm-dom:hover,.cm-dom:focus-visible{transform:translateY(-4px);box-shadow:0 14px 34px rgba(18,58,99,.18);outline:none}
.cm-dom h3{margin:0 0 6px;color:var(--c);font-size:18px;font-weight:900}
.cm-dom .row{display:flex;gap:14px;align-items:center}
.cm-ring{position:relative;width:86px;height:86px;flex:none}
.cm-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cm-ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.cm-ring .bg{stroke:#e8edf5}
.cm-ring .fg{stroke:var(--c);transition:stroke-dashoffset 1s ease}
.cm-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;direction:ltr}
.cm-dom ul{list-style:none;margin:0;padding:0;font-size:13px;flex:1}
.cm-dom li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:1px 0}
.cm-dom li b{direction:ltr}
.cm-go{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--c);font-weight:900;font-size:13px}
/* بطاقة مؤشر */
.cm-ind{--c:var(--d1);text-align:start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 16px rgba(18,58,99,.07);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;gap:6px;border-inline-start:6px solid var(--c)}
.cm-ind:hover,.cm-ind:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(18,58,99,.16);border-color:var(--c);outline:none}
.cm-ind .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{direction:ltr;display:inline-block;background:var(--c);color:#fff;border-radius:8px;padding:0 10px;font-weight:900;font-size:13px}
.cm-ind h4{margin:0;font-size:14.5px;font-weight:800;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:45px}
.cm-meter{height:9px;border-radius:999px;background:#e8edf5;overflow:hidden}
.cm-meter i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .6s ease}
.cm-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:800;color:#334155}
.chip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:0 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok);border:1px solid #86efac}
.chip.wip{background:var(--wipb);color:var(--wip);border:1px solid #fcd34d}
.chip.no{background:#f1f5f9;color:var(--mut);border:1px solid var(--line)}
/* وميض الأخضر (متسق مع المنصة) */
.gl{color:var(--ok);font-weight:900;border-radius:8px;padding:0 6px;background:#ecfdf5;display:inline-block;direction:ltr;unicode-bidi:isolate;animation:glp 1.8s ease-in-out infinite}
@keyframes glp{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.55);background:#ecfdf5}50%{box-shadow:0 0 0 8px rgba(22,163,74,0);background:#bbf7d0}}
/* صفحة المؤشر */
.cm-head{--c:var(--d1);position:relative;overflow:hidden;color:#fff;border-radius:var(--r);padding:18px 22px;background:var(--c);background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#123a63));box-shadow:var(--sh)}
.cm-head::after{content:"";position:absolute;inset-inline-end:-50px;top:-60px;width:210px;height:210px;border:24px solid rgba(255,255,255,.12);transform:rotate(45deg);border-radius:24px}
.cm-head .cr{font-size:13px;opacity:.9;font-weight:700;position:relative}
.cm-head h2{margin:2px 0 6px;font-size:23px;font-weight:900;position:relative}
.cm-head .code{background:#fff;color:var(--c);margin-inline-end:8px}
.cm-head p{margin:0;font-size:16px;font-weight:600;position:relative}
.cm-pills{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent);flex-wrap:wrap}
.cm-pills a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.cm-pills a:hover{background:var(--okb);border-color:#86efac}
.cm-nav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.cm-btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:11px;padding:5px 14px;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none;color:var(--ink)}
.cm-btn:hover{background:#f1f5f9}
.cm-btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.cm-btn.pri:hover{background:var(--blue)}
.cm-btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.cm-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);margin-bottom:16px;scroll-margin-top:60px}
.cm-card>h3{margin:0 0 10px;font-size:17px;font-weight:900;display:flex;gap:8px;align-items:center}
.cm-hl{margin:0;padding:0;list-style:none;counter-reset:h}
.cm-hl li{counter-increment:h;position:relative;padding:7px 38px 7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
html[dir=ltr] .cm-hl li{padding:7px 0 7px 38px}
.cm-hl li:last-child{border-bottom:0}
.cm-hl li::before{content:counter(h);position:absolute;inset-inline-start:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--okb);color:var(--ok);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.cm-recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cm-rec{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fbfcfe;transition:box-shadow .2s,border-color .2s}
.cm-rec.ok{border-color:#86efac;background:#f7fef9}
.cm-rec:hover{box-shadow:0 6px 18px rgba(18,58,99,.12)}
.cm-rec .t{display:flex;gap:10px;align-items:flex-start}
.cm-rec .ic{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:#eef2f8;color:var(--slate);font-size:17px}
.cm-rec.ok .ic{background:var(--okb);color:var(--ok)}
.cm-rec b{font-size:14px;font-weight:800;line-height:1.5}
.cm-rec .acts{display:flex;gap:6px;flex-wrap:wrap}
.cm-rec .acts .cm-btn{padding:2px 10px;font-size:12px}
.cm-rep{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cm-rep .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--okb);color:var(--ok)}
.cm-rep.none .ic{background:var(--wipb);color:var(--wip)}
.cm-note{font-size:12px;color:var(--mut);margin:6px 0 0}
/* نافذة المعاينة */
.cm-mod{position:fixed;inset:0;z-index:2147481000;background:rgba(10,20,40,.7);display:none;align-items:center;justify-content:center;padding:14px}
.cm-mod.on{display:flex}
.cm-mod .box{background:#fff;border-radius:16px;width:min(1000px,100%);height:min(86vh,100%);display:flex;flex-direction:column;overflow:hidden}
.cm-mod .bar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.cm-mod .bar b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-mod iframe{flex:1;border:0;width:100%}
/* رفض الدخول */
.cm-deny{max-width:520px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--sh)}
.cm-deny i{font-size:40px;color:var(--wip)}
.cm-ft{max-width:1280px;margin:0 auto;padding:0 20px 80px;font-size:12px;color:var(--mut)}

/* ثنائي اللغة: العربية والإنجليزية معاً */
.b1,.b2{display:inline}
.b1+.b2{margin-inline-start:.4em}
.cm-k .l .b2,.cm-dom li>span .b2{display:block;font-size:.78em;font-weight:600;margin:0;text-align:right;opacity:.85}
.cm-k .l .b2::before,.cm-dom li>span .b2::before{content:none}
.cm-dom li{align-items:flex-start}
.cm-dom li b{white-space:nowrap}
.b2::before{content:" · ";opacity:.6}
.cm-ttl h1 .b2,.cm-ttl p .b2,.cm-dom h3 .b2,.cm-ind h4 .b2,.cm-head p .b2,.cm-head .cr .b2,.cm-head h2 .b2,.cm-rec b .b2,.cm-hl li .b2,.cm-card>h3 .b2,.cm-h2 .b2,.cm-note .b2,.cm-demo span .b2,.cm-rep b .b2,.cm-deny .b2{display:block;font-size:.8em;font-weight:600;opacity:.88;text-align:right;line-height:1.5}
.cm-ttl h1 .b2::before,.cm-ttl p .b2::before,.cm-dom h3 .b2::before,.cm-ind h4 .b2::before,.cm-head p .b2::before,.cm-head .cr .b2::before,.cm-head h2 .b2::before,.cm-rec b .b2::before,.cm-hl li .b2::before,.cm-card>h3 .b2::before,.cm-h2 .b2::before,.cm-note .b2::before,.cm-demo span .b2::before,.cm-rep b .b2::before,.cm-deny .b2::before{content:none}
.cm-ind h4{-webkit-line-clamp:3;min-height:0}
.cm-head p.il .b2{display:inline;font-size:.85em;text-align:start}
.cm-head p.il .b2::before{content:" · "}
.cm-hl li .b2{color:#334155;font-weight:500}
html[dir=ltr] .b2{text-align:left}
.cm-seg{display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}
.cm-seg button{border:0;background:transparent;color:#fff;font-weight:800;font-size:12.5px;padding:5px 13px;cursor:pointer}
.cm-seg button:hover{background:rgba(255,255,255,.2)}
.cm-seg button[aria-pressed=true]{background:#fff;color:var(--navy)}
.fade{animation:fin .28s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:700px){.cm-hero .in{padding:12px}.cm-ttl h1{font-size:20px}.cm-logos img{height:48px}.cm-tools{margin-inline-start:0}.cm-wrap{padding:12px 12px 70px}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.gl{animation:none;box-shadow:0 0 0 2px #16a34a}.cm-dom,.cm-ind{transition:none}.cm-ring .fg{transition:none}html{scroll-behavior:auto}}
@media print{.cm-demo,.cm-tools,.cm-pills,.cm-nav,.cm-acts,.acts{display:none!important}body{background:#fff}.cm-card,.cm-rec,.cm-ind{break-inside:avoid;box-shadow:none}}
</style>
</head>

      denyT: "الوصول مقيّد", denyP: "هذه الصفحة لمدير النظام وحده. الحساب الحالي غير مصرّح له.", denyB: "تسجيل الخروج", foot: "واجهة عرض للقراءة فقط لمساندة التقويم الخارجي؛ لا تُغني عن القناة الرسمية للهيئة. تُستعمل لعرض نموذج المعاينة داخل المدرسة.", soon: "ملف غير متاح (بيانات توضيحية)" },
    en: { title: "Excellence Accreditation Portal", sub: "American Diploma (Boys' Section) · Primary Stage · Committee View", ro: "Read-only", lang: "العربية",
      demoOn: "Preview prototype — statuses shown are illustrative and auto-generated, not the actual accreditation status.", demoOff: "Updating the database ... (the last saved snapshot is shown if offline). Unapproved records appear as “In progress”.", demoLb: "Illustrative data",
      home: "Home", domains: "The four domains", inds: "Indicators", recsAp: "Approved records", reps: "Evidence reports", done: "Complete indicators", crit: "criteria", ind: "indicators", rec: "records", open: "Open domain",
      hl: "Highlights", records: "Records & documents", report: "Evidence report", appr: "Approved", wip: "In progress", repOk: "Visual report uploaded", repS1: "Report uploaded", repS0: "Report pending", repNo: "Visual report in preparation",
      repOkN: "Contains the selected evidence photos for the indicator.", repNoN: "Will appear here once uploaded and approved.", view: "View here", tab: "Open in browser", dl: "Download (outside browser)", copy: "Copy link", copied: "Copied", folder: "Open indicator folder in Cloud Storage",
      apprOnly: "The committee only sees approved items. Cloud Storage files require view access granted by the school.", prev: "Previous", next: "Next", of: "of", close: "Close",
      denyT: "Restricted access", denyP: "This page is for the system administrator only. The signed-in account is not authorised.", denyB: "Sign out", foot: "A read-only view supporting external evaluation; it does not replace the Commission's official channel. This is an internal preview prototype.", soon: "File unavailable (illustrative data)" }
  };
  function tp(k) { return lang === "en" ? T.en[k] : T.ar[k]; }
  function t(k) { return lang === "both" ? '<span class="b1">' + T.ar[k] + '</span><span class="b2" dir="ltr">' + T.en[k] + "</span>" : tp(k); }
  function bi(a, e2) { a = E(a); e2 = E(e2 || ""); if (lang === "ar" || !e2) return a; if (lang === "en") return e2; return '<span class="b1">' + a + '</span><span class="b2" dir="ltr">' + e2 + "</span>"; }
  var COLS = { 1: "var(--d1)", 2: "var(--d2)", 3: "var(--d3)", 4: "var(--d4)" };
  var en = function () { return lang === "en"; };
  var rtl = function () { return lang !== "en"; };
  function dnp(d) { return en() ? (I18N.dom || {})[d] || P.DN[d] : P.DN[d]; }
  function dn(d) { return bi(P.DN[d], (I18N.dom || {})[d]); }
  function cn(i) { return bi(i.cn, (I18N.crit || {})[i.c]); }
  function itext(i) { return bi(i.text, (I18N.ind || {})[i.code]); }
  function ititle(i) { return lang === "ar" ? E(i.st) : (lang === "en" ? E((I18N.ind || {})[i.code] || i.text) : '<span class="b1">' + E(i.st) + '</span><span class="b2" dir="ltr">' + E((I18N.ind || {})[i.code] || "") + "</span>"); }
  function rnp(n) { var x = (I18N.rec || {})[n]; return en() && x ? x : n; }
  function rn(n) { return bi(n, (I18N.rec || {})[n]); }
  function gl(txt, on) { return on ? '<span class="gl">' + txt + "</span>" : txt; }

  /* ===== الحالات ===== */
  function h(str) { var x = 0; for (var k = 0; k < str.length; k++) x = (x * 31 + str.charCodeAt(k)) >>> 0; return x; }
  function stateDemo(i) {
    var n = i.recs.length, x = h(i.code), k = x % (n + 1), ap = {}, ids = {};
    i.recs.forEach(function (r, j) { ap[r] = j < k; });
    return { ap: ap, ids: ids, apN: k, req: n, rep: (x >> 3) % 3 !== 0, repId: "" };
  }
  function stateReal(i) {
    var s = P.sOf(i), ap = {}, ids = {}, c = 0;
    i.recs.forEach(function (r) { ap[r] = s.st[r] === "approved"; if (ap[r]) { c++; var f = s.fl[r]; if (f && f[2]) ids[r] = f[2]; } });
    var rf = ((s.rep && s.rep.files) || []).filter(function (x) { return x.valid && x.n > 0 && x.id; }).sort(function (a, b) { return b.n - a.n; })[0];
    return { ap: ap, ids: ids, apN: c, req: i.recs.length, rep: s.repState === "done", repId: rf ? rf.id : "" };
  }
  function stOf(i) { return demo ? stateDemo(i) : stateReal(i); }
  function agg(list) {
    var a = { req: 0, apN: 0, rep: 0, full: 0, n: list.length };
    list.forEach(function (i) { var s = stOf(i); a.req += s.req; a.apN += s.apN; if (s.rep) a.rep++; if (s.apN === s.req && s.rep) a.full++; });
    return a;
  }
  function pc(a, b) { return b ? Math.round(a / b * 100) : 0; }

  /* ===== العروض ===== */
  function kpis() {
    var a = agg(inds);
    function k(l, v) { return '<div class="cm-k"><div class="l">' + l + '</div><div class="v">' + v + "</div></div>"; }
    return '<div class="cm-kpis">' + k(t("inds"), inds.length) + k(t("recsAp"), gl(a.apN + " / " + a.req, a.apN)) + k(t("reps"), gl(a.rep, a.rep) + " / " + inds.length) + k(t("done"), gl(a.full, a.full) + " / " + inds.length) + "</div>";
  }
  function ring(p) { var C = 2 * Math.PI * 38; return '<div class="cm-ring"><svg viewBox="0 0 90 90" aria-hidden="true"><circle class="bg" cx="45" cy="45" r="38"/><circle class="fg" cx="45" cy="45" r="38" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '" data-off="' + (C * (1 - p / 100)).toFixed(1) + '"/></svg><b>' + p + "%</b></div>"; }
  function crits(d) { var m = {}, o = []; inds.forEach(function (i) { if (i.d === d && !m[i.c]) { m[i.c] = 1; o.push(i.c); } }); return o; }

  function viewHome() {
    var out = kpis() + '<h2 class="cm-h2"><i class="fa-solid fa-diagram-project" style="color:var(--blue)"></i>' + t("domains") + '</h2><div class="cm-grid dom">';
    [1, 2, 3, 4].forEach(function (d) {
      var l = inds.filter(function (i) { return i.d === d; }), a = agg(l), p = pc(a.apN, a.req);
      out += '<button type="button" class="cm-dom" style="--c:' + COLS[d] + '" data-go="d' + d + '"><h3>' + (dn(d)) + '</h3><div class="row">' + ring(p) + "<ul><li><span>" + t("inds") + "</span><b>" + l.length + "</b></li><li><span>" + t("crit") + "</span><b>" + crits(d).length + "</b></li><li><span>" + t("recsAp") + "</span><b>" + gl(a.apN + " / " + a.req, a.apN) + "</b></li><li><span>" + t("reps") + "</span><b>" + gl(a.rep, a.rep) + " / " + l.length + '</b></li></ul></div><div class="cm-go"><span>' + t("open") + '</span><i class="fa-solid fa-arrow-' + (rtl() ? "left" : "right") + '"></i></div></button>';
    });
    return out + "</div>";
  }
  function indCard(i) {
    var s = stOf(i), p = pc(s.apN, s.req);
    return '<button type="button" class="cm-ind" style="--c:' + COLS[i.d] + '" data-go="' + i.code + '"><div class="top"><span class="code">' + i.code + "</span>" + (s.rep ? '<span class="chip ok"><i class="fa-solid fa-camera"></i> ' + t("repS1") + '</span>' : '<span class="chip no"><i class="fa-regular fa-clock"></i> ' + t("repS0") + '</span>') + "</div><h4>" + (ititle(i)) + '</h4><div class="cm-meter" aria-hidden="true"><i style="width:' + p + '%"></i></div><div class="cm-foot"><span>' + t("recsAp") + " " + gl(s.apN + "/" + s.req, s.apN) + "</span></div></button>";
  }
  function viewDomain(d) {
    var l = inds.filter(function (i) { return i.d === d; }), a = agg(l), out = '<nav class="cm-bc"><a data-go="">' + t("home") + "</a><span>›</span><span>" + (dn(d)) + "</span></nav>";
    out += '<div class="cm-head" style="--c:' + COLS[d] + '"><div class="cr">' + t("domains") + "</div><h2>" + (dn(d)) + "</h2><p class=\"il\">" + l.length + " " + t("ind") + " · " + crits(d).length + " " + t("crit") + " · " + t("recsAp") + " " + a.apN + "/" + a.req + "</p></div>";
    crits(d).forEach(function (c) {
      var li = l.filter(function (i) { return i.c === c; });
      out += '<h2 class="cm-h2"><span class="code" style="--c:' + COLS[d] + '">' + c + "</span>" + (cn(li[0])) + " <small>" + li.length + " " + t("ind") + '</small></h2><div class="cm-grid">' + li.map(indCard).join("") + "</div>";
    });
    return out;
  }
  function recCard(i, s, n) {
    var ok = s.ap[n], id = s.ids[n], acts = "";
    if (ok) {
      if (id) acts = '<button type="button" class="cm-btn" data-view="' + E(id) + '" data-name="' + E(rnp(n)) + '"><i class="fa-solid fa-eye"></i> ' + t("view") + '</button><a class="cm-btn" target="_blank" rel="noopener" href="' + E(P.fileView(id)) + '"><i class="fa-solid fa-up-right-from-square"></i> ' + t("tab") + '</a><a class="cm-btn" target="_blank" rel="noopener" href="' + E(P.fileDl(id)) + '"><i class="fa-solid fa-download"></i> ' + t("dl") + '</a><button type="button" class="cm-btn" data-copy="' + E(P.fileView(id)) + '"><i class="fa-regular fa-copy"></i> ' + t("copy") + "</button>";
      else acts = '<a class="cm-btn" target="_blank" rel="noopener" href="' + E(P.folderUrl(i)) + '"' + (demo ? ' title="' + E(tp("soon")) + '"' : "") + '><i class="fa-brands fa-google-drive"></i> ' + t("folder") + "</a>";
    }
    return '<div class="cm-rec ' + (ok ? "ok" : "") + '"><div class="t"><span class="ic"><i class="fa-regular ' + (ok ? "fa-file-circle-check" : "fa-file") + '"></i></span><div><b>' + (rn(n)) + "</b><div>" + (ok ? '<span class="chip ok"><i class="fa-solid fa-circle-check"></i> ' + t("appr") + "</span>" : '<span class="chip wip"><i class="fa-regular fa-clock"></i> ' + t("wip") + "</span>") + '</div></div></div><div class="acts">' + acts + "</div></div>";
  }
  function viewInd(code) {
    var i = P.byCode(code), s = stOf(i), hl = HL[i.code] || [], idx = inds.indexOf(i), pv = inds[idx - 1], nx = inds[idx + 1], c = COLS[i.d];
    var out = '<nav class="cm-bc"><a data-go="">' + t("home") + '</a><span>›</span><a data-go="d' + i.d + '">' + (dn(i.d)) + "</a><span>›</span><span>" + i.code + "</span></nav>";
    out += '<div class="cm-head" style="--c:' + c + '"><div class="cr">' + (dn(i.d)) + " ‹ " + i.c + " · " + (cn(i)) + '</div><h2><span class="code">' + i.code + "</span>" + (lang === "ar" ? E(i.st) : (lang === "both" ? E(i.st) : "")) + "</h2><p>" + (itext(i)) + "</p></div>";
    out += '<div class="cm-nav"><a class="cm-btn" ' + (pv ? 'data-go="' + pv.code + '"' : 'aria-disabled="true"') + '><i class="fa-solid fa-chevron-' + (rtl() ? "right" : "left") + '"></i> ' + (pv ? pv.code : t("prev")) + '</a><a class="cm-btn" ' + (nx ? 'data-go="' + nx.code + '"' : 'aria-disabled="true"') + ">" + (nx ? nx.code : t("next")) + ' <i class="fa-solid fa-chevron-' + (rtl() ? "left" : "right") + '"></i></a></div>';
    out += '<div class="cm-pills"><a data-sc="s-hl"><i class="fa-solid fa-lightbulb"></i> ' + t("hl") + '</a><a data-sc="s-rec"><i class="fa-solid fa-folder-open"></i> ' + t("records") + '</a><a data-sc="s-rep"><i class="fa-solid fa-camera-retro"></i> ' + t("report") + "</a></div>";
    if (hl.length) out += '<section class="cm-card" id="s-hl"><h3><i class="fa-solid fa-lightbulb" style="color:' + c + '"></i>' + t("hl") + '</h3><ol class="cm-hl">' + hl.map(function (x) { return "<li class=\"stk\">" + (lang === "en" ? E(x.en || x.ar) : (lang === "ar" ? E(x.ar) : '<span class="b1">' + E(x.ar) + '</span><span class="b2" dir="ltr">' + E(x.en || "") + "</span>")) + "</li>"; }).join("") + "</ol></section>";
    out += '<section class="cm-card" id="s-rec"><h3><i class="fa-solid fa-folder-open" style="color:' + c + '"></i>' + t("records") + ' <small style="color:var(--mut);font-weight:700">' + gl(s.apN + " / " + s.req, s.apN) + " " + t("appr") + '</small></h3><div class="cm-recs">' + i.recs.map(function (n) { return recCard(i, s, n); }).join("") + '</div><p class="cm-note">' + t("apprOnly") + "</p></section>";
    var rep = s.rep, rl = "";
    if (rep) rl = s.repId ? '<a class="cm-btn pri" target="_blank" rel="noopener" href="' + E(P.fileView(s.repId)) + '"><i class="fa-solid fa-up-right-from-square"></i> ' + t("tab") + '</a> <button type="button" class="cm-btn" data-view="' + E(s.repId) + '" data-name="' + E(tp("report")) + '"><i class="fa-solid fa-eye"></i> ' + t("view") + '</button> <a class="cm-btn" target="_blank" rel="noopener" href="' + E(P.fileDl(s.repId)) + '"><i class="fa-solid fa-download"></i> ' + t("dl") + "</a>" : "";
    out += '<section class="cm-card" id="s-rep"><h3><i class="fa-solid fa-camera-retro" style="color:' + c + '"></i>' + t("report") + '</h3><div class="cm-rep ' + (rep ? "" : "none") + '"><div class="ic"><i class="fa-solid ' + (rep ? "fa-file-circle-check" : "fa-hourglass-half") + '"></i></div><div><b>' + (rep ? gl(t("repOk"), true) : t("repNo")) + '</b><div class="cm-note">' + (rep ? t("repOkN") : t("repNoN")) + '</div></div></div><p style="margin:12px 0 0">' + rl + ' <a class="cm-btn' + (rl ? "" : " pri") + '" target="_blank" rel="noopener" href="' + E(P.folderUrl(i)) + '"><i class="fa-brands fa-google-drive"></i> ' + t("folder") + "</a></p></section>";
    return out;
  }

  /* ===== التوجيه والرسم ===== */
  function segMark() { var bs = document.querySelectorAll("#langSeg [data-lang]"); for (var k = 0; k < bs.length; k++) bs[k].setAttribute("aria-pressed", bs[k].getAttribute("data-lang") === lang ? "true" : "false"); }
  function route() { return (location.hash || "").slice(1); }
  function render() {
    if (!$("view")) return;
    var r = route(), v = $("view");
    document.documentElement.lang = en() ? "en" : "ar"; document.documentElement.dir = rtl() ? "rtl" : "ltr";
    $("hT").innerHTML = t("title"); $("hS").innerHTML = t("sub"); $("roT").innerHTML = t("ro"); $("demoLb").innerHTML = t("demoLb"); segMark();
    $("demoTxt").innerHTML = demo ? t("demoOn") : t("demoOff"); $("demoBar").className = "cm-demo" + (demo ? "" : " live"); $("ft").innerHTML = t("foot"); $("modX").setAttribute("aria-label", tp("close"));
    var html;
    if (/^d[1-4]$/.test(r)) html = viewDomain(+r.slice(1)); else if (P.byCode(r)) html = viewInd(r); else html = viewHome();
    v.className = "cm-wrap fade"; v.innerHTML = html;
    document.title = tp("title") + " — " + (P.byCode(r) ? r : (/^d[1-4]$/.test(r) ? dnp(+r.slice(1)) : tp("home")));
    var rings = v.querySelectorAll(".cm-ring .fg");
    requestAnimationFrame(function () { requestAnimationFrame(function () { for (var k = 0; k < rings.length; k++) rings[k].setAttribute("stroke-dashoffset", rings[k].getAttribute("data-off")); }); });
  }
  function go(to) { if (("#" + to) === location.hash || (!to && !location.hash)) { render(); } else { location.hash = to; } window.scrollTo(0, 0); }

  function mod(id, name) { $("modT").textContent = name || ""; $("modO").innerHTML = t("tab"); $("modO").href = P.fileView(id); $("modF").src = "https://drive.google.com/file/d/" + id + "/preview"; $("mod").classList.add("on"); $("modX").focus(); }
  function modClose() { $("mod").classList.remove("on"); $("modF").src = "about:blank"; }

  function bind() {
    document.addEventListener("click", function (e) {
      var a = e.target.closest("[data-go]"); if (a && a.getAttribute("aria-disabled") !== "true") { e.preventDefault(); go(a.getAttribute("data-go")); return; }
      var s = e.target.closest("[data-sc]"); if (s) { var el = $(s.getAttribute("data-sc")); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
      var v = e.target.closest("[data-view]"); if (v) { mod(v.getAttribute("data-view"), v.getAttribute("data-name")); return; }
      var c = e.target.closest("[data-copy]"); if (c) { var u = c.getAttribute("data-copy"), lb = c.innerHTML; var done = function () { c.innerHTML = t("copied"); setTimeout(function () { c.innerHTML = lb; }, 1400); }; if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, done); else done(); }
    });
    $("modX").addEventListener("click", modClose);
    $("mod").addEventListener("click", function (e) { if (e.target === $("mod")) modClose(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") modClose(); });
    document.getElementById("langSeg").addEventListener("click", function (e) { var b = e.target.closest("[data-lang]"); if (!b) return; lang = b.getAttribute("data-lang"); try { localStorage.setItem("etec.cm.lang", lang); } catch (x) {} render(); });
    $("demoSw").addEventListener("change", function () { demo = this.checked; render(); });
    window.addEventListener("hashchange", render);
    P.onStatus(function () { if (!demo) render(); });
    P.load(false);
  }

  /* ===== بوابة الدخول: مدير النظام وحده ===== */
  function showDeny() {
    $("app").hidden = true; $("deny").hidden = false;
    $("denyT").innerHTML = t("denyT"); $("denyP").innerHTML = t("denyP"); $("denyBtn").innerHTML = t("denyB");
    $("denyBtn").onclick = function () { try { window.DFGate.logout(); } catch (e) {} location.reload(); };
  }
  var tries = 0;
  function check() {
    if (!window.DFGate) return;
    if (window.DFGate.pvOk && window.DFGate.pvOk() && !window.DFGate.isAuth()) { /* معاينة اطلاع فقط (دور «معاينة») */
      $("deny").hidden = true; $("app").hidden = false;
      if (!started) { started = true; bind(); }
      render(); return;
    }
    if (!$("app")) { if (window.DFGate.isAuth() && tries++ < 30) setTimeout(check, 100); return; }
    tries = 0;
    if (!window.DFGate.isAuth()) { $("app").hidden = true; $("deny").hidden = true; return; }
    window.DFGate.isAdmin().then(function (ok) {
      if (!window.DFGate.isAuth()) { $("app").hidden = true; return; }
      if (!ok) { showDeny(); return; }
      $("deny").hidden = true; $("app").hidden = false;
      if (!started) { started = true; bind(); }
      render();
    });
  }
  window.addEventListener("df-auth", function () { setTimeout(check, 60); });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", check); else check();
})();
</script>
</body>
