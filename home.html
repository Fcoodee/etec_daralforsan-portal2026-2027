<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>مساحتي — مشروع الاعتماد 2026-2027 — مدارس دار الفرسان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="phase.css?v=9.6.8">
<script src="portal-meta.js?v=9.6.8"></script>
<script src="portal-role.js?v=9.6.8"></script>
</head>
<body>
<div id="chrome"></div>
<main class="ph-main" id="main"><div class="ph-empty">جارٍ التحميل…</div></main>

<script src="portal-config.js?v=9.6.8"></script>
<script src="portal-names.js?v=9.6.8"></script>
<script src="phase-data.js?v=9.6.8"></script>
<script src="phase-core.js?v=9.6.8"></script>
<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, role = window.PortalRole ? PortalRole.get() : "", main = document.getElementById("main");
  if (!role) { location.replace("index.html"); return; }
  P.chrome("home.html");

  function stat(l, v, s, cls) { return '<div class="ph-stat ' + (cls || "") + '"><div class="l">' + l + '</div><div class="v" dir="ltr" style="text-align:right">' + v + '</div><div class="s">' + (s || "") + "</div></div>"; }
  function pctTxt(x) { return P.pct(x) + "%"; }
  function pickDomain(then) {
    return '<div class="ph-box"><b>' + then + '</b><div class="ph-pick">' + [1, 2, 3, 4].map(function (d) { return '<button type="button" data-d="' + d + '">' + E(P.DN[d]) + "</button>"; }).join("") + "</div></div>";
  }

  /* ===== عضو الفريق: مؤشراتي وسجلاتي ===== */
  function viewMember() {
    var me = P.me.get();
    if (!me || me.idx < 0) {
      if (!me) { main.innerHTML = '<h1 class="ph-h1">مساحتي</h1><p class="ph-lead">اختر مجالك ثم اسمك مرة واحدة، ويتذكّر هذا الجهاز اختيارك.</p>' + pickDomain("في أي مجال أنت؟"); bindDomain(function (d) { P.me.set({ d: d, idx: -1 }); viewMember(); }); return; }
      var T = P.PH.teams[me.d];
      main.innerHTML = '<h1 class="ph-h1">مساحتي</h1><p class="ph-lead">' + E(P.DN[me.d]) + " — من أنت؟</p>" + '<div class="ph-box"><div class="ph-pick">' +
        T.mem.map(function (n, x) { return '<button type="button" data-m="' + x + '">' + E(n) + "</button>"; }).join("") + '</div><p class="ph-lead" style="margin-top:10px"><button type="button" class="ph-btn" data-back>تغيير المجال</button></p></div>';
      main.onclick = function (e) { var b = e.target.closest("[data-m]"); if (b) { P.me.set({ d: me.d, idx: +b.dataset.m }); viewMember(); return; } if (e.target.closest("[data-back]")) { P.me.clear(); viewMember(); } };
      return;
    }
    var mine = P.PH.inds.filter(function (i) { return i.d === me.d && i.own === me.idx; }), t = P.totals(mine), name = P.PH.teams[me.d].mem[me.idx], only = false;
    function draw() {
      var list = only ? mine.filter(function (i) { return P.sOf(i).pu < 1; }) : mine;
      main.innerHTML = '<h1 class="ph-h1">مساحتي</h1><p class="ph-lead">' + E(name) + " · " + E(P.DN[me.d]) + ' · <a href="#" data-change>تغيير الاسم</a></p>' +
        '<div class="ph-grid">' + stat("سجلاتي المرفوعة", t.ap + " / " + t.req, "بعد مراجعة المشرف · منشأة " + t.cr + " من " + t.req, "main") +
        stat("بانتظار التعبئة", t.blank, "قوالب فارغة تنتظرك") + stat("معبّأة قيد المراجعة", t.review, "رُفعت وتنتظر المشرف") + stat("تقارير الشواهد", t.repDone + " / " + t.ind, "مرفوعة") + "</div>" +
        '<div class="ph-note"><b>كيف أعمل؟</b> افتح بطاقة المؤشر ← «تنزيل» القالب ← عبّئه ← «رفع» من الصف نفسه (Word فقط) فيحلّ محل القالب. يراجعه المشرف ويعتمده فيُحتسب «مرفوعاً». ثم أصدر «تقرير الشواهد» من صفحته وارفعه بزر «رفع التقرير».</div>' +
        '<div class="ph-filters"><button type="button" class="ph-pill" aria-pressed="' + only + '" data-only>غير المرفوعة فقط</button><a class="ph-btn" href="indicators.html">كل مؤشرات المشروع</a></div>' +
        '<div id="cards">' + (list.length ? list.map(function (i) { return P.card(i, { owner: false }); }).join("") : '<div class="ph-empty">لا توجد مؤشرات مسندة لك في هذه القائمة.</div>') + "</div>";
      P.bindCards(main);
      main.querySelector("[data-only]").addEventListener("click", function () { only = !only; draw(); });
      main.querySelector("[data-change]").setAttribute("href", "index.html");
      applyRoles();
    }
    main.onclick = null; draw();
  }

  /* ===== مشرف الفريق: فريقي وما ينتظر مراجعتي ===== */
  function viewSup() {
    var me = P.me.get();
    if (!me) { main.innerHTML = '<h1 class="ph-h1">فريقي</h1><p class="ph-lead">اختر مجال فريقك مرة واحدة.</p>' + pickDomain("أي فريق تشرف عليه؟"); bindDomain(function (d) { P.me.set({ d: d, idx: -1 }); viewSup(); }); return; }
    var T = P.PH.teams[me.d], team = P.PH.inds.filter(function (i) { return i.d === me.d; }), tt = P.totals(team);
    var rows = T.mem.map(function (n, x) { var l = team.filter(function (i) { return i.own === x; }), t = P.totals(l); return '<tr><td>' + E(n) + '</td><td class="n">' + l.length + '</td><td class="n" dir="ltr">' + t.ap + " / " + t.req + '</td><td class="n">' + t.review + '</td><td class="n">' + t.repDone + " / " + l.length + "</td></tr>"; }).join("");
    var wait = [];
    team.forEach(function (i) { var s = P.sOf(i); i.recs.forEach(function (n) { if (s.st[n] === "review") wait.push({ i: i, n: n }); }); });
    main.innerHTML = '<h1 class="ph-h1">فريقي</h1><p class="ph-lead">' + E(T.sup) + " · " + E(P.DN[me.d]) + ' · <a href="#" data-change>تغيير الفريق</a></p>' +
      '<h2 class="ph-h2">بانتظار مراجعتك <span class="ph-chip wip">' + wait.length + "</span></h2>" +
      (wait.length ? '<div class="ph-box"><ul class="ph-recs">' + wait.map(function (w) { return '<li class="ph-rec"><span class="ph-recn"><a href="indicators.html?code=' + E(w.i.code) + '"><b dir="ltr">' + E(w.i.code) + "</b></a> · " + E(w.n) + ' <small>(' + E(P.ownerName(w.i)) + ')</small></span><a class="ph-btn" target="_blank" rel="noopener" href="' + P.folderUrl(w.i) + '">افتح المجلد</a></li>'; }).join("") + "</ul></div>" : '<div class="ph-empty">لا توجد سجلات بانتظار المراجعة الآن.</div>') +
      '<details class="ph-box" style="margin-top:14px"><summary style="cursor:pointer;font-weight:800">تقدّم أعضاء الفريق</summary><table class="ph-t"><thead><tr><th>العضو</th><th>مؤشرات</th><th>مرفوعة / مطلوب</th><th>قيد المراجعة</th><th>تقارير مرفوعة</th></tr></thead><tbody>' + rows + "</tbody></table></details>" +
      '<details class="ph-box" style="margin-top:10px"><summary style="cursor:pointer;font-weight:800">مؤشرات الفريق</summary><div id="cards">' + team.map(function (i) { return P.card(i); }).join("") + "</div></details>";
    P.bindCards(main); applyRoles();
    main.onclick = function (e) { if (e.target.closest("[data-change]")) { e.preventDefault(); location.href = "index.html"; } };
  }

  /* ===== مدير النظام ومشرف التقويم الذاتي: الصورة الكاملة ===== */
  function viewAll() {
    var t = P.totals(), isAdmin = role === "admin", T = P.PH.teams;
    var doms = [1, 2, 3, 4].map(function (d) { var l = P.PH.inds.filter(function (i) { return i.d === d; }), x = P.totals(l); return '<div class="ph-stat"><div class="l">' + E(P.DN[d]) + '</div><div class="v" dir="ltr" style="text-align:right">' + pctTxt(P.domP(d)) + '</div><div class="s">منشأة ' + x.cr + " · مرفوعة " + x.ap + " من " + x.req + " سجلاً · " + l.length + " مؤشراً</div>" + P.bar2(P.domP(d, "u"), P.domP(d, "c")) + "</div>"; }).join("");
    var crit = P.critList().map(function (c) { return { c: c, p: P.critP(c.c, "u"), pc: P.critP(c.c, "c") }; }).sort(function (a, b) { return a.p - b.p || (a.c.c < b.c.c ? -1 : 1); });
    var crows = crit.map(function (x) { var l = P.PH.inds.filter(function (i) { return i.c === x.c.c; }), tt = P.totals(l); return '<tr><td class="n" dir="ltr">' + E(x.c.c) + "</td><td>" + E(x.c.cn) + "</td><td>" + E(P.DN[x.c.d]) + '</td><td class="n" dir="ltr">' + tt.ap + " / " + tt.req + "</td><td>" + P.bar2(x.p, x.pc) + '</td><td class="n">' + pctTxt(x.p) + "</td></tr>"; }).join("");
    var trows = [1, 2, 3, 4].map(function (d) { var l = P.PH.inds.filter(function (i) { return i.d === d; }), x = P.totals(l); var ms = T[d].mem.map(function (n, k) { var q = P.totals(l.filter(function (i) { return i.own === k; })); return E(n) + ' <small dir="ltr">(' + q.ap + "/" + q.req + ")</small>"; }).join(" · ");
      return "<tr><td>" + E(P.DN[d]) + "</td><td>" + E(T[d].sup) + "</td><td>" + ms + '</td><td class="n">' + x.review + '</td><td class="n">' + pctTxt(x.p) + "</td></tr>"; }).join("");
    var admin = "";
    if (isAdmin) {
      var S = P.ST, bad = [], inv = [], legacy = [], miss = [];
      P.PH.inds.forEach(function (i) { var s = P.sOf(i); s.invalid.forEach(function (f) { inv.push(i.code + " ← " + f); }); i.recs.forEach(function (n) { if (s.st[n] === "missing") miss.push(i.code + " ← " + n); }); (s.rep.files || []).forEach(function (f) { if (f.legacy) legacy.push(i.code + " ← " + f.name); }); });
      (S.errors || []).forEach(function (e) { bad.push(e.key + ": " + e.error); });
      var pr = function (a) { return a.length ? "<ul>" + a.slice(0, 12).map(function (x) { return "<li dir='auto'>" + E(x) + "</li>"; }).join("") + (a.length > 12 ? "<li>… و" + (a.length - 12) + " أخرى</li>" : "") + "</ul>" : '<span class="ph-chip ok">لا شيء</span>'; };
      admin = '<h2 class="ph-h2">صحة المنظومة <span class="ph-chip idle">لمدير النظام</span></h2><div class="ph-grid">' + stat("الاتصال بـ Drive", S.live && !S.failed ? "متصل" : "غير متصل", S.live ? "إصدار السكربت " + E(S.ver) + (S.partial ? " · مسح جزئي" : "") : "تُعرض لقطة 12-11-2026") +
        stat("سجلات غير منشأة", miss.length, "بلا ملف في مجلدها") + stat("ملفات لا تطابق سجلاً", inv.length, "أسماء تحتاج تصحيحاً") + stat("تقارير بالتسمية القديمة", legacy.length, "«التقرير البصري»") + "</div>" +
        '<div class="ph-box"><b>أخطاء المسح</b>' + pr(bad) + "<b>سجلات غير منشأة</b>" + pr(miss) + "<b>ملفات لا تطابق أي سجل</b>" + pr(inv) + "<b>تقارير بالتسمية القديمة</b>" + pr(legacy) + '<div class="ph-actions"><a class="ph-btn" target="_blank" rel="noopener" href="' + P.rootUrl() + '"><i class="fa-solid fa-folder-tree"></i> جذر Drive الجديد</a></div></div>';
    }
    main.innerHTML = '<h1 class="ph-h1">' + (isAdmin ? "لوحة مدير النظام" : "الفجوات والنسب") + '</h1><p class="ph-lead">صورة واحدة للمشروع: ' + (isAdmin ? "هل المنظومة سليمة وأين نقف؟" : "أين فجواتنا؟") + "</p>" +
      '<div class="ph-grid">' + stat("التقدّم الرسمي", pctTxt(P.projP()), "متوسط " + t.ind + " مؤشراً · سجلات + تقرير الشواهد", "main") + "</div>" +
      '<h2 class="ph-h2">المجالات</h2><div class="ph-grid">' + doms + "</div>" +
      '<h2 class="ph-h2">المعايير من الأضعف (بحسب المرفوعة)</h2><table class="ph-t"><thead><tr><th>المعيار</th><th>الاسم</th><th>المجال</th><th>مرفوعة / مطلوب</th><th>منشأة ◂ مرفوعة</th><th></th></tr></thead><tbody>' + crows + "</tbody></table>" +
      '<h2 class="ph-h2">الفرق</h2><table class="ph-t"><thead><tr><th>المجال</th><th>المشرف</th><th>الأعضاء (مرفوعة/مطلوب)</th><th>قيد المراجعة</th><th>التقدّم الرسمي</th></tr></thead><tbody>' + trows + "</tbody></table>" +
      admin +
      '<div class="ph-actions" style="margin-top:14px"><a class="ph-btn pri" href="indicators.html"><i class="fa-solid fa-list-check"></i> استعراض المؤشرات والسجلات</a></div>';
  }

  function bindDomain(cb) { main.onclick = function (e) { var b = e.target.closest("[data-d]"); if (b) cb(+b.dataset.d); }; }
  function applyRoles() { if (window.PortalRole && PortalRole.refresh) { /* يعيد تطبيق data-roles على البطاقات المرسومة */ try { var els = main.querySelectorAll("[data-roles]"); for (var k = 0; k < els.length; k++) els[k].classList.toggle("pr-off", els[k].getAttribute("data-roles").split(",").indexOf(role) < 0); } catch (e) {} } }

  function render() { if (role === "member") viewMember(); else if (role === "sup") viewSup(); else viewAll(); applyRoles(); }
  P.onStatus(render);
  P.load();
})();
</script>
<script src="page-gate.js" data-lazy="1"></script>
<script src="legal-notice.js"></script>
<script src="content-protect.js"></script>
</body>
</html>
