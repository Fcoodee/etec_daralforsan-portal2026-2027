    PH.inds.filter(function (i) { return i.c === code; }).forEach(function (i) {
      var s = P.sOf(i);
      (i.recs || []).forEach(function (r) {
        var f = s.fl && s.fl[r];
        if (f && f[2] && f[0] === 1 && (s.st[r] || "") === "approved") rows.push('<li><span class="rf-rn"><b dir="ltr">' + E(i.code) + "</b> · " + E(r) + "</span>" + vbtn(f[2], "⁦" + i.code + "⁩ · " + r, "عرض: " + r) + "</li>");
      });
      var rf = repFile(s);
      if (rf) rows.push('<li><span class="rf-rn"><b dir="ltr">' + E(i.code) + "</b> · تقرير الشواهد البصرية</span>" + vbtn(rf.id, "⁦" + i.code + "⁩ · تقرير الشواهد البصرية", "عرض تقرير الشواهد البصرية") + "</li>");
    });
    return rows.length ? '<details class="pg-cf ad-only"><summary>سجلات وتقارير للعرض (' + rows.length + ')</summary><ul class="rf-rl">' + rows.join("") + "</ul></details>" : "";
  }

  /* المشرف الأكاديمي للقسم: بطاقة منفصلة أعلى فريق العمل */
  /* فريق العمل: من phase-data.js (قائمة فريق 2026-2027 التي زوّد بها مدير المشروع) */
  function teamHtml() {
    var T = PH.teams || {};
    return '<section class="pg-box nd-sup" aria-label="المشرف الأكاديمي للقسم" style="margin-top:14px"><div class="nd-supin"><span class="nd-emo" aria-hidden="true">👔</span><div><div class="nd-supr">المشرف الأكاديمي للقسم</div><div class="nd-supn">أ. محمود فتحي</div></div></div></section>' +
      '<details class="pg-box pg-fold" id="fd-team" data-keep="closed" style="margin-top:14px"' + foldAttr("fd-team", true) + '><summary><span class="pg-tg" aria-hidden="true"><span class="tc">▾ +</span><span class="to">▴ −</span></span><h2>فريق العمل</h2><span class="pg-fs">مشرفو المجالات وأعضاؤها: <b dir="ltr">' + [1, 2, 3, 4].reduce(function (n, d) { return n + (T[d] ? 1 + (T[d].mem || []).length : 0); }, 0) + '</b> · اضغط للعرض</span></summary>' +
      '<p class="pg-note" style="margin:0 0 6px">مشرفو المجالات وأعضاؤها في مشروع هذا العام. المراحل السابقة (جمع الشواهد والتقويم الذاتي 2025-26) حُفظت مخرجاتها في مساحة مكتب الإشراف والتطوير، وهذه اللوحة تتابع المرحلة الحالية: السجلات ورفعها واعتمادها وتقارير شواهدها.</p>' +
      '<div class="nd-team">' + [1, 2, 3, 4].filter(function (d) { return T[d]; }).map(function (d) {
        return '<div class="nd-tm" style="--c:' + COL[d][0] + ";--cb:" + COL[d][1] + '"><h4>' + E(P.DN[d]) + '</h4><div class="ld">' + E(T[d].sup) + ' <small>(مشرف المجال)</small></div><div>' + T[d].mem.map(E).join(" · ") + "</div></div>";
      }).join("") + "</div></details>";
  }

  /* حركة الدخول: حلقة الإنجاز وقطاعات الدائرة وعدّاد الأرقام (WAAPI؛ تعمل على iOS/Android وتُتجاهل بصمت حيث لا تتوفر) */
  function pgAnimate(sc) {
    sc = sc || document;
    try {
      var RM = window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches;
      Array.prototype.forEach.call(sc.querySelectorAll(".pg-dn .seg"), function (c) {
        if (c.__an || !c.animate || c.closest("details:not([open])")) return; c.__an = 1;
        var da = c.getAttribute("stroke-dasharray") || ""; if (!da) return; var L = da.split(/[ ,]+/);
        c.animate([{ strokeDasharray: "0 " + (parseFloat(L[0]) + parseFloat(L[1] || 0)) }, { strokeDasharray: da }], { duration: 1000, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
      /* الأرقام الدالّة على التقدم: تعدّ صعودًا أو هبوطًا من القيمة السابقة (data-ck) إلى الحالية، والحلقة الكبرى تتحرك بالتزامن مع رقمها (data-cr) */
      var PV = window.__pgPrev = window.__pgPrev || {};
      Array.prototype.forEach.call(sc.querySelectorAll("[data-cn]"), function (b) {
        if (b.__cu || b.closest("details:not([open])")) return; b.__cu = 1;
        var to = +b.getAttribute("data-cn"), dec = +(b.getAttribute("data-cd") || 0), suf = b.getAttribute("data-cs") || "", key = b.getAttribute("data-ck"), ring = b.getAttribute("data-cr") ? b.closest(".pg-ring").querySelector("svg circle:last-child") : null;
        var from = key && key in PV ? PV[key] : 0;
        var C = 2 * Math.PI * 52;
        function put(v) { if (key) PV[key] = v; b.textContent = v.toFixed(dec) + suf; if (ring) ring.setAttribute("stroke-dasharray", (Math.max(0, v) / 100 * C).toFixed(1) + " " + C.toFixed(1)); }
        if (RM || from === to) { put(to); return; }
        put(from); var t0 = null, dur = ring ? 1100 : 900;
        function step(t) { if (!b.isConnected) return; if (t0 === null) t0 = t; var k = Math.min(1, (t - t0) / dur); put(from + (to - from) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); else put(to); }
        requestAnimationFrame(step);
      });
    } catch (e) {}
  }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.open && t.classList && (t.classList.contains("pg-fold") || t.classList.contains("pg-dw"))) pgAnimate(t); }, true);
  var foldKeep = {};
  function isAdm() { return document.documentElement.classList.contains("sh-admin"); }
  function foldAttr(id, closed) { var o = (id in foldKeep) ? foldKeep[id] : false; return o ? " open" : ""; }
  document.addEventListener("toggle", function (e) { var t = e.target; if (t && t.classList && (t.classList.contains("pg-fold") || t.classList.contains("pg-dw")) && t.id) foldKeep[t.id] = t.open; }, true);
  window.addEventListener("beforeprint", function () { Array.prototype.forEach.call(document.querySelectorAll(".pg-fold,.pg-dw"), function (d) { d.open = true; }); });

  function render(ST) {
    lastST = ST;
    var all = PH.inds, S = all.map(function (i) { return { i: i, s: P.sOf(i) }; }), T = P.totals();
    var projP = P.projP(), live = ST && ST.live, asof = (ST && ST.asof) || (window.ETEC_SNAPSHOT || {}).asof || "";
    var st = { approved: 0, review: 0, blank: 0, missing: 0 };
    S.forEach(function (x) { x.i.recs.forEach(function (n) { var k = x.s.st[n] || "blank"; if (k === "returned") k = "blank"; st[k] = (st[k] || 0) + 1; }); });
    var keepQ = document.getElementById("q") ? document.getElementById("q").value : "", keepA = document.getElementById("fa") ? document.getElementById("fa").value : "";

    var h = '<h1 class="ph-h1">نحو التميز · نسبة الإنجاز الكلية للمشروع</h1>' +
      '<p class="ph-lead"><b class="vis-only">وضع الاستعراض · للاطلاع فقط</b><b class="ad-only">وضع العمل · مدير النظام</b> · من المجال إلى المعيار فالمؤشر فالسجلات الداعمة وتقرير الشواهد البصرية · ' + (live ? "حالة محدّثة" : "آخر لقطة محفوظة") + (asof ? " · " + E(asof) : "") + "</p>";

    h += '<section class="pg-hero" aria-label="نسبة الإنجاز الكلية"><div class="pg-ring">' + ring(projP, "#0f766e") + '<div class="c"><b dir="ltr" data-cn="' + (projP * 100).toFixed(4) + '" data-cd="2" data-cs="%" data-ck="proj" data-cr="1">' + pc2(projP) + '%</b><small>نسبة الإنجاز الكلية</small></div></div><div>' +
      '<div class="pg-kpis">' +
      kpi("المؤشرات", T.ind, null, "في 4 مجالات و" + P.critList().length + " معياراً", "#0f766e", "fa-list-check", "k-ind") +
      kpi("السجلات الجاهزة", T.ap, T.req, "معبّأة ومعتمدة", "#047857", "fa-circle-check", "k-ap") +
      kpi("السجلات المنشأة", T.cr, T.req, "القوالب موجودة", "#1d4ed8", "fa-file-circle-plus", "k-cr") +
      kpi("معبّأة قيد المراجعة", T.review, null, "بانتظار المشرفين", "#b45309", "fa-hourglass-half", "k-rv") +
      kpi("تقارير الشواهد البصرية", T.repDone, T.ind, "مرفوعة", "#7e22ce", "fa-images", "k-rp") + "</div>" +
      "</div></section>";

    h += '<h2 class="ph-h2">المجالات <small class="vis-only" style="font-weight:600;color:var(--mut)">(اضغط مجالاً لتصفية الشجرة)</small></h2><div class="pg-doms">';
    [1, 2, 3, 4].forEach(function (d) {
      var l = S.filter(function (x) { return x.i.d === d; }), t = P.totals(l.map(function (x) { return x.i; })), ba = avg(l.map(function (x) { return x.s.pa; })), bb = avg(l.map(function (x) { return x.s.pb; })), br = avg(l.map(function (x) { return x.s.pr; })), tot = ba + bb + br, tf = l.length ? t.repDone / l.length : 0;
      h += '<div class="pg-domw" style="--c:' + COL[d][0] + ';--cb:' + COL[d][1] + '"><button type="button" class="pg-dom" data-dom="' + d + '" style="--c:' + COL[d][0] + ";--cb:" + COL[d][1] + '"><h3>' + E(P.DN[d]) + '</h3><div class="big" data-cn="' + pc(tot) + '" data-cs="%" data-ck="dom' + d + '">' + pc(tot) + "%</div>" +
        '<div class="pg-bar" role="img" aria-label="منشأة ' + pc(ba) + "% وجاهزة " + pc(bb) + "% وتقارير " + pc(br) + '% من 100"><i class="b" style="width:' + (ba * 100).toFixed(1) + '%"></i><i class="r" style="width:' + (bb * 100).toFixed(1) + '%"></i><i class="t" style="width:' + (br * 100).toFixed(1) + '%"></i></div>' +
        '<div class="pg-leg"><span style="--k:color-mix(in srgb,' + COL[d][0] + ' 40%,#fff)">منشأة <b data-cn="' + pc(ba) + '" data-cs="%" data-ck="dba' + d + '">' + pc(ba) + '%</b></span><span style="--k:' + COL[d][0] + '">جاهزة <b data-cn="' + pc(bb) + '" data-cs="%" data-ck="dbb' + d + '">' + pc(bb) + '%</b></span><span style="--k:repeating-linear-gradient(45deg,' + COL[d][0] + "," + COL[d][0] + ' 2px,#fff 2px,#fff 4px)">التقارير <b data-cn="' + pc(br) + '" data-cs="%" data-ck="dbr' + d + '">' + pc(br) + '%</b></span></div>' +
        "</button>" +
        '<details class="pg-dw" id="dw' + d + '"' + foldAttr("dw" + d) + ' style="--c:' + COL[d][0] + '"><summary><span>تفاصيل المجال</span>' + '<span class="pg-tg" aria-hidden="true"><span class="tc">▾ +</span><span class="to">▴ −</span></span></summary>' + "<ul><li>المؤشرات · المعايير<b>" + l.length + " · " + P.critList(d).length + "</b></li><li>سجلات جاهزة<b>" + t.ap + " / " + t.req + "</b></li><li>سجلات منشأة<b>" + t.cr + " / " + t.req + "</b></li><li" + (t.review > 0 ? ' class="rv-on" title="بانتظار مراجعة المشرفين"' : "") + ">قيد المراجعة<b>" + t.review + "</b></li><li>تقارير مرفوعة<b>" + t.repDone + " / " + l.length + "</b></li></ul></details></div>";
    });
    h += "</div>";

    var crits = P.critList().sort(function (a, b) { return a.d - b.d || (a.c < b.c ? -1 : 1); });
    var cp = crits.map(function (x) { return P.critP(x.c, null); }), cmin = cp.length ? Math.min.apply(null, cp) : 0, cmax = cp.length ? Math.max.apply(null, cp) : 0;
    h += '<div class="pg-two"><details class="pg-box pg-fold" id="fd-crit"' + foldAttr("fd-crit") + '><summary><span class="pg-tg" aria-hidden="true"><span class="tc">▾ +</span><span class="to">▴ −</span></span><h2>المعايير الأحد عشر</h2><span class="pg-fs">اكتمال المعايير من <b dir="ltr">' + pc(cmin) + '%</b> إلى <b dir="ltr">' + pc(cmax) + '%</b> · اضغط للتفاصيل</span></summary>' + crits.map(function (x) {
      var p = P.critP(x.c, null), n = all.filter(function (i) { return i.c === x.c; }).length;
      return '<div class="pg-crit" style="--c:' + COL[x.d][0] + '"><span class="n">' + E(x.c) + '</span><div class="tr" role="img" aria-label="' + E(x.cn) + " " + pc(p) + '%"><i style="width:' + pc(p) + '%"></i></div><span class="p" data-cn="' + pc(p) + '" data-cs="%" data-ck="c' + E(x.c) + '">' + pc(p) + "%</span><small>" + E(x.cn) + " · " + n + " مؤشر</small>" + critFiles(x.c) + "</div>";
    }).join("") + "</details>" +
      '<details class="pg-box pg-fold ad-only" id="fd-st"' + foldAttr("fd-st") + '><summary><span class="pg-tg" aria-hidden="true"><span class="tc">▾ +</span><span class="to">▴ −</span></span><h2>حالة السجلات (' + T.req + ')</h2><span class="pg-fs">جاهز <b dir="ltr">' + st.approved + '</b> · قيد المراجعة <b dir="ltr">' + st.review + '</b> · بانتظار التعبئة <b dir="ltr">' + (st.blank + (st.missing || 0)) + '</b> · اضغط للمخططات</span></summary><div class="pg-donut">' + donut(dnParts(st)) + donutList(dnParts(st)) + "</div>" + domBars(S) + "</details></div>";
    window.__dnParts = dnParts(st); setTimeout(function () { window.__dnBind(document); }, 0);

    h += teamHtml();

    h += '<div class="vis-only"><h2 class="ph-h2" style="margin-top:18px">المجال ← المعيار ← المؤشر ← السجلات الداعمة ← تقرير الشواهد البصرية</h2>' +
      '<div class="rf-tools" role="search"><input type="search" id="q" placeholder="ابحث: رمز مؤشر (1-1-1-1) أو كلمة من نص المؤشر أو اسم سجل" aria-label="بحث">' +
      '<select id="fa" aria-label="تصفية بحالة السجلات"><option value="">كل الحالات</option><option value="ap">فيها سجلات جاهزة</option><option value="rv">فيها سجلات قيد المراجعة</option><option value="bl">فيها سجلات بانتظار التعبئة أو معادة</option><option value="rp">تقريرها البصري مرفوع</option><option value="norp">تقريرها البصري غير مرفوع</option></select>' +
      '<button type="button" class="ph-btn sm" id="ex">فتح الكل</button><button type="button" class="ph-btn sm" id="clr">إزالة التصفية</button><span class="rf-cnt" id="cnt" role="status"></span></div><div id="tree"></div></div>';

    main.innerHTML = h;
    setTimeout(function () { pgAnimate(main); }, 30);
    tree = document.getElementById("tree"); cnt = document.getElementById("cnt");
    document.getElementById("q").value = keepQ; document.getElementById("fa").value = keepA;
    drawTree();
  }

  /* ===== تفاعل ثابت (تفويض أحداث) ===== */
  var mod = document.getElementById("rfMod"), fr = document.getElementById("rfF"), pdfBox = document.getElementById("rfPdf"), lastBtn = null, t0;
  function showFrame() { pdfBox.hidden = true; fr.hidden = false; if (window.PortalPDF) PortalPDF.clear(); }
  /* v10.8.7: العرض داخل الصفحة بلا حساب Google عند المشاهد: يجلب السكربت (بصفة مالكه) محتوى PDF/صورة فيُعرض هنا؛ وإن تعذّر نعود لمعاينة التخزين السحابي */
  var blobUrl = "";
  function openFile(id) {
    if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = ""; }
    try { window.PortalFX && PortalFX.idle(); } catch (e) {}
    showFrame();
    var tok = (openFile.n = (openFile.n || 0) + 1), done = false, rfT = document.getElementById("rfT"), base = rfT.textContent;
    var fallback = function (why) { if (done || tok !== openFile.n) return; done = true; rfT.textContent = base + (why ? " — " + why : ""); fr.src = "https://drive.google.com/file/d/" + id + "/preview"; };
    if (!window.ETEC_STATUS_URL) { fallback(); return; }
    fr.removeAttribute("src"); rfT.textContent = base + " — جاري تحميل الملف ...";
    var tm = setTimeout(function () { fallback("تأخر التحميل"); }, 20000);
    fetch(window.ETEC_STATUS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "viewFile", id: id }) })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        clearTimeout(tm); if (done || tok !== openFile.n) return;
        if (!o || !o.ok) { fallback(o && o.error); return; }
        done = true; rfT.textContent = base;
        var bin = atob(o.b64), u8 = new Uint8Array(bin.length); for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
        if (o.mime === "application/pdf" && window.PortalPDF && PortalPDF.needs()) {
          fr.removeAttribute("src"); fr.hidden = true; pdfBox.hidden = false;
          PortalPDF.render(pdfBox, u8).catch(function (er) { showFrame(); rfT.textContent = base + " — تعذّر العرض داخل الصفحة (" + (er && er.message || er) + ")"; fr.src = "https://drive.google.com/file/d/" + id + "/preview"; });
          return;
        }
        blobUrl = URL.createObjectURL(new Blob([u8], { type: o.mime })); fr.src = blobUrl;
      })
      .catch(function () { clearTimeout(tm); fallback(); });
  }
  function closeM() { openFile.n = (openFile.n || 0) + 1; mod.classList.remove("on"); fr.removeAttribute("src"); showFrame(); if (lastBtn && document.body.contains(lastBtn)) lastBtn.focus(); }
  document.getElementById("rfX").addEventListener("click", closeM);
  mod.addEventListener("click", function (e) { if (e.target === mod) closeM(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && mod.classList.contains("on")) closeM(); });
  main.addEventListener("input", function (e) { if (e.target.id === "q") { clearTimeout(t0); t0 = setTimeout(drawTree, 160); } });
  main.addEventListener("change", function (e) { if (e.target.id === "fa") drawTree(); });
  main.addEventListener("click", function (e) {
    var b = e.target.closest("[data-v]");
    if (b) { lastBtn = b; var id = b.dataset.v; document.getElementById("rfT").textContent = b.dataset.vt || ""; document.getElementById("rfO").href = "https://drive.google.com/file/d/" + id + "/view"; mod.classList.add("on"); try { openFile(id); } catch (err) { document.getElementById("rfT").textContent += " — " + (err && err.message || err); fr.src = "https://drive.google.com/file/d/" + id + "/preview"; } document.getElementById("rfX").focus(); return; }
    var d = e.target.closest("[data-dom]");
    if (d) { fdSel = d.dataset.dom === "" || String(fdSel) === d.dataset.dom ? "" : d.dataset.dom; drawTree(); var t = document.getElementById("tree"); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (e.target.closest("#clr")) { fdSel = ""; document.getElementById("q").value = ""; document.getElementById("fa").value = ""; drawTree(); return; }
    var x = e.target.closest("#ex");
    if (x) { var open = x.dataset.o !== "1"; tree.querySelectorAll("details").forEach(function (n) { n.open = open; }); x.dataset.o = open ? "1" : ""; x.textContent = open ? "طيّ الكل" : "فتح الكل"; }
  });

  P.onStatus(render);
  P.load(false);
})();
