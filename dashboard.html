<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, PH = P.PH, main = document.getElementById("main");
  if (/[?&]preview=visitor/.test(location.search)) { document.documentElement.classList.add("pv-vis"); var pb = document.createElement("div"); pb.className = "pv-bar"; pb.textContent = "معاينة بعين الزائر · مؤقتة لمدير النظام وحده"; var pa = document.createElement("a"); pa.href = "dashboard.html"; pa.textContent = "العودة لوضع العمل"; pb.appendChild(pa); document.body.insertBefore(pb, document.body.firstChild); }
  P.chrome("dashboard.html");
  var COL = { 1: ["#1d4ed8", "#eff6ff"], 2: ["#047857", "#ecfdf5"], 3: ["#b45309", "#fffbeb"], 4: ["#7e22ce", "#faf5ff"] };
  function pc(x) { return Math.round((x || 0) * 100); }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
  function ring(p, col) {
    var C = 2 * Math.PI * 52;
    return '<svg viewBox="0 0 120 120" role="img" aria-label="' + pc(p) + '%"><circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (p * C).toFixed(1) + " " + C.toFixed(1) + '"/></svg>';
  }
  function donut(parts) {
    var C = 2 * Math.PI * 52, tot = parts.reduce(function (s, x) { return s + x.v; }, 0) || 1, off = 0, h = "";
    parts.forEach(function (x) { var l = x.v / tot * C; if (l > 0) h += '<circle cx="60" cy="60" r="52" fill="none" stroke="' + x.c + '" stroke-width="16" stroke-dasharray="' + l.toFixed(1) + " " + (C - l).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '"/>'; off += l; });
    return '<svg viewBox="0 0 120 120" role="img" aria-label="توزيع حالات السجلات"><circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="16"/>' + h + "</svg>";
  }
  function kpi(l, v, s) { return '<div class="pg-kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + s + "</div></div>"; }
  function repFile(s) { return ((s.rep && s.rep.files) || []).filter(function (x) { return x.valid && x.n > 0 && x.id; }).sort(function (a, b) { return b.n - a.n; })[0]; }

  var tree = null, cnt = null, fdSel = "", lastST = null, openKeep = {};

  /* ===== بطاقة المؤشر داخل الشجرة ===== */
  function indHtml(i) {
    var s = P.sOf(i), rec = i.recs || [], apN = 0, c = COL[i.d];
    var rc = rec.length ? '<ul class="rf-rl">' + rec.map(function (r) {
      var k = s.st[r] || "blank", f = s.fl && s.fl[r], ok = !!(f && f[2] && f[0] === 1); if (k === "approved") apN++;
      return '<li><span class="rf-rn">' + E(r) + '</span><span class="rf-rs">' + P.chip(k) + (ok ? ' <button type="button" class="ph-btn sm" data-v="' + E(f[2]) + '" data-vt="' + E("⁦" + i.code + "⁩ · " + r) + '" aria-label="عرض: ' + E(r) + '"><i class="fa-solid fa-eye"></i> عرض</button>' : "") + "</span></li>";
    }).join("") + "</ul>" + "" : '<span class="ph-lead">لا سجلات مرتبطة.</span>';
    var rf = repFile(s);
    var rp = '<div class="rf-rs">' + (rf ? '<span class="ph-chip ok">مرفوع · ' + rf.n + ' صور</span> <button type="button" class="ph-btn sm" data-v="' + E(rf.id) + '" data-vt="' + E("⁦" + i.code + "⁩ · تقرير الشواهد البصرية") + '" aria-label="عرض تقرير الشواهد البصرية"><i class="fa-solid fa-eye"></i> عرض</button>' : '<span class="ph-chip idle">لم يُرفع بعد</span>') +
      ' <a class="ph-btn sm ad-only" href="report.html?code=' + E(i.code) + '"><i class="fa-solid fa-file-image"></i> ' + (rf ? "فتح في مولّد التقارير" : "إصدار التقرير") + "</a></div>";
    var key = i.code;
    return '<details class="rf-ind" id="i-' + E(i.code) + '" data-code="' + E(i.code) + '"' + (openKeep[key] ? " open" : "") + ' style="--c:' + c[0] + ";--cb:" + c[1] + '"><summary><span class="rf-code">' + E(i.code) + '</span><span class="rf-txt">' + E(i.text) +
      "<small>" + (i.dv ? '<span class="rf-chip">سجل متابعة</span>' : '<span class="rf-chip">سجلات رسمية</span>') + "السجل الرئيس: " + E(i.st || "") + " · جاهز " + apN + "/" + rec.length + "</small></span>" +
      '<span class="rf-pp" title="اكتمال المؤشر">' + pc(s.p) + "%</span></summary>" +
      '<div class="rf-body"><div class="rf-box"><h4>السجلات الداعمة (' + rec.length + ")</h4>" + rc + '</div><div class="rf-box"><h4>تقرير الشواهد البصرية</h4>' + rp + "</div></div>" +
      '<p class="ad-only" style="margin:6px 0 0"><a class="ph-btn sm" href="indicators.html?code=' + E(i.code) + '"><i class="fa-solid fa-list-check"></i> مساحة عمل المؤشر (رفع واعتماد)</a></p></details>';
  }

  function drawTree() {
    if (!tree) return;
    var A = document.getElementById("fa").value, term = (document.getElementById("q").value || "").trim().toLowerCase(), D = fdSel, shown = 0, html = "";
    tree.querySelectorAll(".rf-ind[open]").forEach(function (d) { openKeep[d.dataset.code] = 1; });
    tree.querySelectorAll(".rf-ind:not([open])").forEach(function (d) { delete openKeep[d.dataset.code]; });
    var by = {};
    PH.inds.forEach(function (i) { (by[i.d] = by[i.d] || {}); (by[i.d][i.c] = by[i.d][i.c] || { n: i.cn, l: [] }).l.push(i); });
    [1, 2, 3, 4].forEach(function (d) {
      if (D && String(D) !== String(d) || !by[d]) return;
      var cc = "", dn = 0, c = COL[d];
      Object.keys(by[d]).forEach(function (k) {
        var cr = by[d][k], ih = "", n = 0;
        cr.l.forEach(function (i) {
          var s = P.sOf(i), st = {}; i.recs.forEach(function (r) { st[s.st[r] || "blank"] = 1; });
          var rep = !!repFile(s);
          if (A === "ap" && !st.approved) return; if (A === "rv" && !st.review) return; if (A === "bl" && !(st.blank || st.missing || st.returned)) return;
          if (A === "rp" && !rep) return; if (A === "norp" && rep) return;
          if (term && [i.code, i.text, i.st, i.recs.join(" ")].join(" ").toLowerCase().indexOf(term) < 0) return;
          n++; ih += indHtml(i);
        });
        if (n) { dn += n; cc += '<details class="rf-crit" open style="--c:' + c[0] + '"><summary><span class="n">' + E(k) + "</span> " + E(cr.n) + "<small>" + n + " مؤشر · " + pc(P.critP(k, null)) + "%</small></summary>" + ih + "</details>"; }
      });
      if (dn) { shown += dn; html += '<details class="rf-dom" id="dom-' + d + '" open style="--c:' + c[0] + ";--cb:" + c[1] + '"><summary><b>المجال ' + d + " — " + E(P.DN[d]) + "</b><small>" + dn + " مؤشر ضمن النتائج</small></summary>" + cc + "</details>"; }
    });
    tree.innerHTML = html || '<div class="ph-empty">لا نتائج مطابقة.</div>';
    cnt.textContent = shown + " من " + PH.inds.length + " مؤشراً";
  }

  function openInd(code) {
    var d = document.getElementById("i-" + code);
    if (!d) { document.getElementById("fa").value = ""; document.getElementById("q").value = ""; fdSel = ""; drawTree(); d = document.getElementById("i-" + code); }
    if (!d) return;
    var p = d.parentNode; while (p && p !== tree) { if (p.tagName === "DETAILS") p.open = true; p = p.parentNode; }
    d.open = true; d.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  /* ===== ملفات المعيار: سجلات معتمدة وتقارير مرفوعة فقط، بزر عرض (بلا شجرة) ===== */
  function vbtn(id, t, lbl) { return '<button type="button" class="ph-btn sm" data-v="' + E(id) + '" data-vt="' + E(t) + '" aria-label="' + E(lbl) + '"><i class="fa-solid fa-eye"></i> عرض</button>'; }
  function critFiles(code) {
    var rows = [];
    PH.inds.filter(function (i) { return i.c === code; }).forEach(function (i) {
      var s = P.sOf(i);
      (i.recs || []).forEach(function (r) {
        var f = s.fl && s.fl[r];
        if (f && f[2] && f[0] === 1 && (s.st[r] || "") === "approved") rows.push('<li><span class="rf-rn"><b dir="ltr">' + E(i.code) + "</b> · " + E(r) + "</span>" + vbtn(f[2], "⁦" + i.code + "⁩ · " + r, "عرض: " + r) + "</li>");
      });
      var rf = repFile(s);
      if (rf) rows.push('<li><span class="rf-rn"><b dir="ltr">' + E(i.code) + "</b> · تقرير الشواهد البصرية</span>" + vbtn(rf.id, "⁦" + i.code + "⁩ · تقرير الشواهد البصرية", "عرض تقرير الشواهد البصرية") + "</li>");
    });
    return rows.length ? '<details class="pg-cf ad-only"><summary>سجلات وتقارير للعرض (' + rows.length + ')</summary><ul class="rf-rl">' + rows.join("") + "</ul></details>" : "";
  }

  /* المشرف الأكاديمي للقسم: بطاقة منفصلة أعلى فريق العمل */
  /* فريق العمل: من phase-data.js (قائمة فريق 2026-2027 التي زوّد بها مدير المشروع) */
  function teamHtml() {
    var T = PH.teams || {};
    return '<section class="pg-box nd-sup" aria-label="المشرف الأكاديمي للقسم" style="margin-top:14px"><div class="nd-supin"><span class="nd-emo" aria-hidden="true">👔</span><div><div class="nd-supr">المشرف الأكاديمي للقسم</div><div class="nd-supn">أ. محمود فتحي</div></div></div></section>' +
      '<section class="pg-box" style="margin-top:14px"><h2>فريق العمل</h2>' +
      '<p class="pg-note" style="margin:0 0 6px">مشرفو المجالات وأعضاؤها في مشروع هذا العام. المراحل السابقة (جمع الشواهد والتقويم الذاتي 2025-26) حُفظت مخرجاتها في مساحة مكتب الإشراف والتطوير، وهذه اللوحة تتابع المرحلة الحالية: السجلات ورفعها واعتمادها وتقارير شواهدها.</p>' +
      '<div class="nd-team">' + [1, 2, 3, 4].filter(function (d) { return T[d]; }).map(function (d) {
        return '<div class="nd-tm" style="--c:' + COL[d][0] + ";--cb:" + COL[d][1] + '"><h4>' + E(P.DN[d]) + '</h4><div class="ld">' + E(T[d].sup) + ' <small>(مشرف المجال)</small></div><div>' + T[d].mem.map(E).join(" · ") + "</div></div>";
      }).join("") + "</div></section>";
  }

  function render(ST) {
    lastST = ST;
    var all = PH.inds, S = all.map(function (i) { return { i: i, s: P.sOf(i) }; }), T = P.totals();
    var projP = P.projP(), live = ST && ST.live, asof = (ST && ST.asof) || (window.ETEC_SNAPSHOT || {}).asof || "";
    var st = { approved: 0, review: 0, blank: 0, missing: 0 };
    S.forEach(function (x) { x.i.recs.forEach(function (n) { var k = x.s.st[n] || "blank"; if (k === "returned") k = "blank"; st[k] = (st[k] || 0) + 1; }); });
    var keepQ = document.getElementById("q") ? document.getElementById("q").value : "", keepA = document.getElementById("fa") ? document.getElementById("fa").value : "";

    var h = '<h1 class="ph-h1">نحو التميز · نسبة الإنجاز الكلية للمشروع</h1>' +
      '<p class="ph-lead"><b class="vis-only">وضع الاستعراض · للاطلاع فقط</b><b class="ad-only">وضع العمل · مدير النظام</b> · من المجال إلى المعيار فالمؤشر فالسجلات الداعمة وتقرير الشواهد البصرية · ' + (live ? "حالة محدّثة" : "آخر لقطة محفوظة") + (asof ? " · " + E(asof) : "") + "</p>";

    h += '<section class="pg-hero" aria-label="نسبة الإنجاز الكلية"><div class="pg-ring">' + ring(projP, "#0f766e") + '<div class="c"><b dir="ltr">' + pc(projP) + '%</b><small>نسبة الإنجاز الكلية</small></div></div><div>' +
      '<div class="pg-kpis">' +
      kpi("المؤشرات", T.ind, "في 4 مجالات و" + P.critList().length + " معياراً") +
      kpi("السجلات الجاهزة", T.ap + " / " + T.req, "معبّأة ومعتمدة") +
      kpi("السجلات المنشأة", T.cr + " / " + T.req, "القوالب موجودة") +
      kpi("معبّأة قيد المراجعة", T.review, "بانتظار المشرفين") +
      kpi("تقارير الشواهد البصرية", T.repDone + " / " + T.ind, "مرفوعة") + "</div>" +
      "</div></section>";

    h += '<h2 class="ph-h2">المجالات <small class="vis-only" style="font-weight:600;color:var(--mut)">(اضغط مجالاً لتصفية الشجرة)</small></h2><div class="pg-doms">';
    [1, 2, 3, 4].forEach(function (d) {
      var l = S.filter(function (x) { return x.i.d === d; }), t = P.totals(l.map(function (x) { return x.i; })), ba = avg(l.map(function (x) { return x.s.pa; })), bb = avg(l.map(function (x) { return x.s.pb; })), br = avg(l.map(function (x) { return x.s.pr; })), tot = ba + bb + br, tf = l.length ? t.repDone / l.length : 0;
      h += '<button type="button" class="pg-dom" data-dom="' + d + '" style="--c:' + COL[d][0] + ";--cb:" + COL[d][1] + '"><h3>' + E(P.DN[d]) + '</h3><div class="big">' + pc(tot) + "%</div>" +
        '<div class="pg-bar" role="img" aria-label="منشأة ' + pc(ba) + "% وجاهزة " + pc(bb) + "% وتقارير " + pc(br) + '% من 100"><i class="b" style="width:' + (ba * 100).toFixed(1) + '%"></i><i class="r" style="width:' + (bb * 100).toFixed(1) + '%"></i><i class="t" style="width:' + (br * 100).toFixed(1) + '%"></i></div>' +
        '<div class="pg-leg"><span style="--k:color-mix(in srgb,' + COL[d][0] + ' 40%,#fff)">منشأة ' + pc(ba) + '%</span><span style="--k:' + COL[d][0] + '">جاهزة ' + pc(bb) + '%</span><span style="--k:repeating-linear-gradient(45deg,' + COL[d][0] + "," + COL[d][0] + ' 2px,#fff 2px,#fff 4px)">التقارير ' + pc(br) + "%</span></div>" +
        "<ul><li>المؤشرات · المعايير<b>" + l.length + " · " + P.critList(d).length + "</b></li><li>سجلات جاهزة<b>" + t.ap + " / " + t.req + "</b></li><li>سجلات منشأة<b>" + t.cr + " / " + t.req + "</b></li><li>قيد المراجعة<b>" + t.review + "</b></li><li>تقارير مرفوعة<b>" + t.repDone + " / " + l.length + "</b></li></ul></button>";
    });
    h += "</div>";

    var crits = P.critList().sort(function (a, b) { return a.d - b.d || (a.c < b.c ? -1 : 1); });
    h += '<div class="pg-two"><section class="pg-box"><h2>المعايير الأحد عشر</h2>' + crits.map(function (x) {
      var p = P.critP(x.c, null), n = all.filter(function (i) { return i.c === x.c; }).length;
      return '<div class="pg-crit" style="--c:' + COL[x.d][0] + '"><span class="n">' + E(x.c) + '</span><div class="tr" role="img" aria-label="' + E(x.cn) + " " + pc(p) + '%"><i style="width:' + pc(p) + '%"></i></div><span class="p">' + pc(p) + "%</span><small>" + E(x.cn) + " · " + n + " مؤشر</small>" + critFiles(x.c) + "</div>";
    }).join("") + "</section>" +
      '<section class="pg-box"><h2>حالة السجلات (' + T.req + ')</h2><div class="pg-donut">' + donut([{ v: st.approved, c: "#047857" }, { v: st.review, c: "#d97706" }, { v: st.blank, c: "#94a3b8" }, { v: st.missing, c: "#dc2626" }]) +
      '<ul><li style="--k:#047857">جاهزة (معتمدة) <b>' + st.approved + '</b></li><li style="--k:#d97706">معبّأة قيد المراجعة <b>' + st.review + '</b></li><li style="--k:#94a3b8">منشأة بانتظار التعبئة <b>' + st.blank + '</b></li><li style="--k:#dc2626">غير منشأة <b>' + st.missing + "</b></li></ul></div></section></div>";

    h += teamHtml();

    h += '<div class="vis-only"><h2 class="ph-h2" style="margin-top:18px">المجال ← المعيار ← المؤشر ← السجلات الداعمة ← تقرير الشواهد البصرية</h2>' +
      '<div class="rf-tools" role="search"><input type="search" id="q" placeholder="ابحث: رمز مؤشر (1-1-1-1) أو كلمة من نص المؤشر أو اسم سجل" aria-label="بحث">' +
      '<select id="fa" aria-label="تصفية بحالة السجلات"><option value="">كل الحالات</option><option value="ap">فيها سجلات جاهزة</option><option value="rv">فيها سجلات قيد المراجعة</option><option value="bl">فيها سجلات بانتظار التعبئة أو معادة</option><option value="rp">تقريرها البصري مرفوع</option><option value="norp">تقريرها البصري غير مرفوع</option></select>' +
      '<button type="button" class="ph-btn sm" id="ex">فتح الكل</button><button type="button" class="ph-btn sm" id="clr">إزالة التصفية</button><span class="rf-cnt" id="cnt" role="status"></span></div><div id="tree"></div></div>';

    main.innerHTML = h;
    tree = document.getElementById("tree"); cnt = document.getElementById("cnt");
    document.getElementById("q").value = keepQ; document.getElementById("fa").value = keepA;
    drawTree();
  }

  /* ===== تفاعل ثابت (تفويض أحداث) ===== */
  var mod = document.getElementById("rfMod"), fr = document.getElementById("rfF"), lastBtn = null, t0;
  /* v10.8.7: العرض داخل الصفحة بلا حساب Google عند المشاهد: يجلب السكربت (بصفة مالكه) محتوى PDF/صورة فيُعرض هنا؛ وإن تعذّر نعود لمعاينة التخزين السحابي */
  var blobUrl = "";
  function openFile(id) {
    if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} blobUrl = ""; }
    try { window.PortalFX && PortalFX.idle(); } catch (e) {}
    var tok = (openFile.n = (openFile.n || 0) + 1), done = false, rfT = document.getElementById("rfT"), base = rfT.textContent;
    var fallback = function (why) { if (done || tok !== openFile.n) return; done = true; rfT.textContent = base + (why ? " — " + why : ""); fr.src = "https://drive.google.com/file/d/" + id + "/preview"; };
    if (!window.ETEC_STATUS_URL) { fallback(); return; }
    fr.removeAttribute("src"); rfT.textContent = base + " — جاري تحميل الملف ...";
    var tm = setTimeout(function () { fallback("تأخر التحميل"); }, 20000);
    fetch(window.ETEC_STATUS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "viewFile", id: id }) })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        clearTimeout(tm); if (done || tok !== openFile.n) return;
        if (!o || !o.ok) { fallback(o && o.error); return; }
        done = true; rfT.textContent = base;
        var bin = atob(o.b64), u8 = new Uint8Array(bin.length); for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
        blobUrl = URL.createObjectURL(new Blob([u8], { type: o.mime })); fr.src = blobUrl;
      })
      .catch(function () { clearTimeout(tm); fallback(); });
  }
  function closeM() { openFile.n = (openFile.n || 0) + 1; mod.classList.remove("on"); fr.removeAttribute("src"); if (lastBtn && document.body.contains(lastBtn)) lastBtn.focus(); }
  document.getElementById("rfX").addEventListener("click", closeM);
  mod.addEventListener("click", function (e) { if (e.target === mod) closeM(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && mod.classList.contains("on")) closeM(); });
  main.addEventListener("input", function (e) { if (e.target.id === "q") { clearTimeout(t0); t0 = setTimeout(drawTree, 160); } });
  main.addEventListener("change", function (e) { if (e.target.id === "fa") drawTree(); });
  main.addEventListener("click", function (e) {
    var b = e.target.closest("[data-v]");
    if (b) { lastBtn = b; var id = b.dataset.v; document.getElementById("rfT").textContent = b.dataset.vt || ""; document.getElementById("rfO").href = "https://drive.google.com/file/d/" + id + "/view"; mod.classList.add("on"); try { openFile(id); } catch (err) { document.getElementById("rfT").textContent += " — " + (err && err.message || err); fr.src = "https://drive.google.com/file/d/" + id + "/preview"; } document.getElementById("rfX").focus(); return; }
    var d = e.target.closest("[data-dom]");
    if (d && document.documentElement.classList.contains("sh-admin") && !document.documentElement.classList.contains("pv-vis")) return;
    if (d) { fdSel = String(fdSel) === d.dataset.dom ? "" : d.dataset.dom; drawTree(); var t = document.getElementById("tree"); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (e.target.closest("#clr")) { fdSel = ""; document.getElementById("q").value = ""; document.getElementById("fa").value = ""; drawTree(); return; }
    var x = e.target.closest("#ex");
    if (x) { var open = x.dataset.o !== "1"; tree.querySelectorAll(".rf-ind").forEach(function (n) { n.open = open; }); x.dataset.o = open ? "1" : ""; x.textContent = open ? "طيّ الكل" : "فتح الكل"; }
  });

  P.onStatus(render);
  P.load(false);
})();
</script>
