<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>قراءة التقدّم — مشروع الاعتماد 2026-2027 — مدارس دار الفرسان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="phase.css?v=9.6.3">
<script src="portal-meta.js?v=9.6.3"></script>
<script src="portal-role.js?v=9.6.3"></script>
<style>
:root{--d1:#1d4ed8;--d2:#047857;--d3:#b45309;--d4:#7e22ce;--d1b:#eff6ff;--d2b:#ecfdf5;--d3b:#fffbeb;--d4b:#faf5ff}
.pg-hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px}
.pg-ring{position:relative;width:150px;height:150px}
.pg-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.pg-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pg-ring .c b{font-size:32px;font-weight:900;line-height:1}
.pg-ring .c small{font-size:11px;color:var(--mut);font-weight:700}
.pg-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pg-kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.pg-kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.pg-kpi .v{font-size:22px;font-weight:900;direction:ltr;text-align:right}
.pg-kpi .s{font-size:11px;color:var(--mut)}
.pg-formula{margin:10px 0 0;font-size:12.5px;color:#334155}
.pg-doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0}
.pg-dom{border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;background:var(--cb);padding:12px 14px}
.pg-dom h3{margin:0;font-size:15px;font-weight:900;color:var(--c)}
.pg-dom .big{font-size:34px;font-weight:900;color:var(--c);line-height:1.2;direction:ltr;text-align:right}
.pg-bar{display:flex;height:12px;border-radius:999px;background:#fff;border:1px solid var(--line);overflow:hidden}
.pg-bar i{display:block;height:100%}
.pg-bar .r{background:var(--c)}
.pg-bar .t{background:repeating-linear-gradient(45deg,var(--c),var(--c) 3px,#fff 3px,#fff 6px);opacity:.75}
.pg-dom ul{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;color:#334155}
.pg-dom li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.pg-dom li b{direction:ltr}
.pg-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#334155;margin:6px 0 0}
.pg-leg span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-2px;background:var(--k)}
.pg-two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.pg-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.pg-box h2{margin:0 0 8px;font-size:15px;font-weight:900}
.pg-crit{display:grid;grid-template-columns:48px 1fr 46px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
.pg-crit .n{direction:ltr;font-weight:800;color:var(--c)}
.pg-crit .tr{height:14px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.pg-crit .tr i{display:block;height:100%;background:var(--c);border-radius:999px;min-width:2px}
.pg-crit .p{direction:ltr;font-weight:800;text-align:left}
.pg-crit small{grid-column:2/4;color:var(--mut);margin-top:-4px}
.pg-donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.pg-donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.pg-donut ul{list-style:none;margin:0;padding:0;font-size:12.5px}
.pg-donut li::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-2px;background:var(--k)}
.pg-donut li b{direction:ltr;display:inline-block}
.pg-heat{display:flex;flex-direction:column;gap:10px}
.pg-hrow h4{margin:0 0 4px;font-size:12.5px;font-weight:900;color:var(--c)}
.pg-tiles{display:flex;flex-wrap:wrap;gap:5px}
.pg-tile{display:flex;align-items:center;justify-content:center;width:62px;height:34px;border-radius:8px;border:2px solid var(--c);background:linear-gradient(to top,var(--c) var(--f),#fff var(--f));font-size:10.5px;font-weight:800;direction:ltr;text-decoration:none;color:#0f172a;position:relative}
.pg-tile span{background:rgba(255,255,255,.88);border-radius:4px;padding:0 3px}
.pg-tile.rep::after{content:"";position:absolute;top:2px;inset-inline-end:2px;width:7px;height:7px;border-radius:50%;background:#16a34a;border:1px solid #fff}
.pg-note{font-size:12px;color:var(--mut);margin-top:8px}
@media(max-width:760px){.pg-hero{grid-template-columns:1fr;justify-items:center}.pg-two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="chrome"></div>
<main class="ph-main" id="main"><div class="ph-empty">جارٍ التحميل…</div></main>

<script src="portal-config.js?v=9.6.3"></script>
<script src="portal-names.js?v=9.6.3"></script>
<script src="phase-data.js?v=9.6.3"></script>
<script src="phase-core.js?v=9.6.3"></script>
<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, main = document.getElementById("main");
  P.chrome("progress.html");
  var COL = { 1: ["#1d4ed8", "#eff6ff"], 2: ["#047857", "#ecfdf5"], 3: ["#b45309", "#fffbeb"], 4: ["#7e22ce", "#faf5ff"] };
  function pc(x) { return Math.round((x || 0) * 100); }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : 0; }
  function recF(s) { return P.basis() === "uploaded" ? s.rpu : s.rpc; }
  function ring(p, col, size) {
    var C = 2 * Math.PI * 52;
    return '<svg viewBox="0 0 120 120" role="img" aria-label="' + pc(p) + '%"><circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (p * C).toFixed(1) + " " + C.toFixed(1) + '"/></svg>';
  }
  function donut(parts) {
    var C = 2 * Math.PI * 52, tot = parts.reduce(function (s, x) { return s + x.v; }, 0) || 1, off = 0, h = "";
    parts.forEach(function (x) { var l = x.v / tot * C; if (l > 0) h += '<circle cx="60" cy="60" r="52" fill="none" stroke="' + x.c + '" stroke-width="16" stroke-dasharray="' + l.toFixed(1) + " " + (C - l).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '"/>'; off += l; });
    return '<svg viewBox="0 0 120 120" role="img" aria-label="توزيع حالات السجلات">' + '<circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="16"/>' + h + "</svg>";
  }

  function render(ST) {
    var all = P.PH.inds, S = all.map(function (i) { return { i: i, s: P.sOf(i) }; }), T = P.totals();
    var projP = P.projP(), live = ST && ST.live, asof = (ST && ST.asof) || (window.ETEC_SNAPSHOT || {}).asof || "";
    /* حالات السجلات */
    var st = { approved: 0, review: 0, blank: 0, missing: 0 };
    S.forEach(function (x) { x.i.recs.forEach(function (n) { var k = x.s.st[n] || "blank"; st[k] = (st[k] || 0) + 1; }); });
    var h = '<h1 class="ph-h1">قراءة التقدّم</h1><p class="ph-lead">صورة واحدة لكل المجالات الأربعة · ' + (live ? "بيانات حيّة من Drive" : "آخر لقطة محفوظة") + (asof ? " · " + E(asof) : "") + "</p>";

    h += '<section class="pg-hero" aria-label="التقدم الرسمي"><div class="pg-ring">' + ring(projP, "#0f766e") + '<div class="c"><b dir="ltr">' + pc(projP) + '%</b><small>التقدّم الرسمي</small></div></div><div>' +
      '<div class="pg-kpis">' +
      kpi("المؤشرات", T.ind, "في 4 مجالات و" + P.critList().length + " معياراً") +
      kpi("السجلات المرفوعة", T.ap + " / " + T.req, "بعد مراجعة المشرف") +
      kpi("السجلات المنشأة", T.cr + " / " + T.req, "القوالب موجودة") +
      kpi("معبّأة قيد المراجعة", T.review, "بانتظار المشرفين") +
      kpi("تقارير الشواهد", T.repDone + " / " + T.ind, "مرفوعة") + "</div>" +
      '<p class="pg-formula"><b>كيف تُقرأ النسبة؟</b> اكتمال المؤشر = نصف لسجلاته ووثائقه (الأساس الحالي: ' + E(P.basisTxt()) + ") + نصف لتقرير الشواهد. فمؤشر بلا تقرير لا يتجاوز 50%.</p></div></section>";

    /* بطاقات المجالات */
    h += '<h2 class="ph-h2">المجالات</h2><div class="pg-doms">';
    [1, 2, 3, 4].forEach(function (d) {
      var l = S.filter(function (x) { return x.i.d === d; }), t = P.totals(l.map(function (x) { return x.i; })), rf = avg(l.map(function (x) { return recF(x.s); })), tf = l.length ? t.repDone / l.length : 0, tot = (rf + tf) / 2;
      var cr = P.critList(d).length;
      h += '<article class="pg-dom" style="--c:' + COL[d][0] + ";--cb:" + COL[d][1] + '"><h3>' + E(P.DN[d]) + '</h3><div class="big">' + pc(tot) + "%</div>" +
        '<div class="pg-bar" role="img" aria-label="سجلات ' + pc(rf / 2) + '% وتقارير ' + pc(tf / 2) + '% من 100"><i class="r" style="width:' + (rf * 50).toFixed(1) + '%"></i><i class="t" style="width:' + (tf * 50).toFixed(1) + '%"></i></div>' +
        '<div class="pg-leg" style="--c:' + COL[d][0] + '"><span style="--k:' + COL[d][0] + '">السجلات ' + pc(rf) + '%</span><span style="--k:repeating-linear-gradient(45deg,' + COL[d][0] + ',' + COL[d][0] + ' 2px,#fff 2px,#fff 4px)">التقارير ' + pc(tf) + "%</span></div>" +
        "<ul><li>المؤشرات · المعايير<b>" + l.length + " · " + cr + "</b></li><li>سجلات مرفوعة<b>" + t.ap + " / " + t.req + "</b></li><li>سجلات منشأة<b>" + t.cr + " / " + t.req + "</b></li><li>قيد المراجعة<b>" + t.review + "</b></li><li>تقارير مرفوعة<b>" + t.repDone + " / " + l.length + "</b></li><li>المشرف<b style=\"direction:rtl\">" + E(P.PH.teams[d].sup) + "</b></li></ul></article>";
    });
    h += "</div>";

    /* المعايير + توزيع الحالات */
    var crits = P.critList().sort(function (a, b) { return a.d - b.d || (a.c < b.c ? -1 : 1); });
    h += '<div class="pg-two"><section class="pg-box"><h2>المعايير الأحد عشر</h2>' + crits.map(function (x) {
      var p = P.critP(x.c, null), n = all.filter(function (i) { return i.c === x.c; }).length;
      return '<div class="pg-crit" style="--c:' + COL[x.d][0] + '"><span class="n">' + E(x.c) + '</span><div class="tr" role="img" aria-label="' + E(x.cn) + " " + pc(p) + '%"><i style="width:' + pc(p) + '%"></i></div><span class="p">' + pc(p) + "%</span><small>" + E(x.cn) + " · " + n + " مؤشراً</small></div>";
    }).join("") + '<p class="pg-note">اللون = المجال: أزرق للإدارة المدرسية، أخضر للتعليم والتعلم، عنبري لنواتج التعلم، بنفسجي للبيئة المدرسية.</p></section>' +
      '<section class="pg-box"><h2>حالة السجلات (' + T.req + ")</h2><div class=\"pg-donut\">" + donut([{ v: st.approved, c: "#047857" }, { v: st.review, c: "#d97706" }, { v: st.blank, c: "#94a3b8" }, { v: st.missing, c: "#dc2626" }]) +
      '<ul><li style="--k:#047857">مرفوعة (معتمدة) <b>' + st.approved + '</b></li><li style="--k:#d97706">معبّأة قيد المراجعة <b>' + st.review + '</b></li><li style="--k:#94a3b8">منشأة بانتظار التعبئة <b>' + st.blank + '</b></li><li style="--k:#dc2626">غير منشأة <b>' + st.missing + "</b></li></ul></div></section></div>";

    /* خريطة المؤشرات */
    h += '<section class="pg-box" style="margin-top:14px"><h2>خريطة المؤشرات الـ' + T.ind + '</h2><div class="pg-heat">' + [1, 2, 3, 4].map(function (d) {
      return '<div class="pg-hrow" style="--c:' + COL[d][0] + '"><h4>' + E(P.DN[d]) + '</h4><div class="pg-tiles">' + S.filter(function (x) { return x.i.d === d; }).map(function (x) {
        return '<a class="pg-tile' + (x.s.repState === "done" ? " rep" : "") + '" style="--f:' + pc(x.s.p) + '%" href="indicators.html?code=' + E(x.i.code) + '" title="' + E(x.i.code + " · " + x.i.st + " — " + pc(x.s.p) + "%" + (x.s.repState === "done" ? " · التقرير مرفوع" : " · بلا تقرير")) + '"><span>' + E(x.i.code) + "</span></a>";
      }).join("") + "</div></div>";
    }).join("") + '</div><p class="pg-note">ارتفاع التعبئة داخل المربع = نسبة اكتمال المؤشر. النقطة الخضراء = تقرير الشواهد مرفوع. اضغط أي مؤشر لفتح بطاقته.</p></section>';

    main.innerHTML = h;
  }
  function kpi(l, v, s) { return '<div class="pg-kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + s + "</div></div>"; }
  P.onStatus(render);
  P.load(false);
})();
</script>
</body>
</html>
