        function calculateProgress(indicators) {
            if (!indicators || indicators.length === 0) return 0;
            let totalWeight = 0;
            indicators.forEach(ind => {
                if (ind.status === 'green' || ind.status === 'blue') totalWeight += 100;
                else if (ind.status === 'cyan') totalWeight += 85;
                else if (ind.status === 'yellow') totalWeight += 60;
                else if (ind.status === 'gray') totalWeight += 35;
                else if (ind.status === 'red') totalWeight += 10;
            });
            return Math.round(totalWeight / indicators.length);
        }

        function getColorStyles(status) {
            const styles = {
                green:  { bg: 'bg-emerald-100 text-emerald-800 border-emerald-500', label: 'مكتمل ومعتمد' },
                blue:   { bg: 'bg-blue-100 text-blue-800 border-blue-500', label: 'جاهز هندسياً/وقائياً' },
                cyan:   { bg: 'bg-cyan-100 text-cyan-800 border-cyan-500', label: 'مرحلة المراجعة النهائية' },
                yellow: { bg: 'bg-amber-100 text-amber-800 border-amber-500', label: 'مرحلة المسودة' },
                gray:   { bg: 'bg-slate-200 text-slate-800 border-slate-400', label: 'نقص أدلة' },
                red:    { bg: 'bg-rose-100 text-rose-800 border-rose-500', label: 'فجوة حرجة' }
            };
            return styles[status] || { bg: 'bg-gray-100 text-gray-800 border-gray-400', label: 'غير محدد' };
        }

        function buildFullReport() {
            const root = document.getElementById('report-root');
            let allIndicators = [];
            comprehensiveDashboardData.forEach(d => d.standards.forEach(s => s.focusAreas.forEach(f => allIndicators.push(...f.indicators))));

            document.getElementById('report-total').innerText = allIndicators.length;
            document.getElementById('report-overall').innerText = calculateProgress(allIndicators) + '%';
            document.getElementById('report-date').innerText = new Date().toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' });

            let html = '';
            comprehensiveDashboardData.forEach((domain, dIdx) => {
                let domainIndicators = [];
                domain.standards.forEach(s => s.focusAreas.forEach(f => domainIndicators.push(...f.indicators)));
                const domainPct = calculateProgress(domainIndicators);

                html += `
                <section class="mb-10 ${dIdx > 0 ? 'page-break' : ''}">
                    <div class="bg-gradient-to-l from-slate-900 via-slate-800 to-etecteal-900 text-white rounded-t-xl p-5">
                        <div class="flex flex-wrap justify-between items-center gap-3">
                            <h2 class="text-xl font-extrabold">${domain.title}</h2>
                            <span class="px-3 py-1 bg-accentgold text-slate-950 font-black text-sm rounded-full">نسبة إنجاز المجال: ${domainPct}%</span>
                        </div>
                        <div class="text-xs text-slate-300 mt-3 flex flex-wrap gap-6">
                            <span><i class="fa-solid fa-user-tie text-accentgold ml-1"></i> المسؤول الأول: ${domain.manager}</span>
                            <span><i class="fa-solid fa-users text-cyan-400 ml-1"></i> فريق العمل: ${domain.team}</span>
                        </div>
                    </div>
                    <div class="bg-white border border-t-0 border-gray-100 rounded-b-xl p-5 space-y-6">
                `;

                domain.standards.forEach(standard => {
                    let stdIndicators = [];
                    standard.focusAreas.forEach(f => stdIndicators.push(...f.indicators));
                    const stdPct = calculateProgress(stdIndicators);

                    html += `
                        <div class="border border-slate-200 rounded-lg overflow-hidden">
                            <div class="bg-etecteal-50 px-4 py-2.5 flex justify-between items-center border-b border-etecteal-100">
                                <h3 class="font-extrabold text-sm text-etecteal-900">${standard.title}</h3>
                                <span class="text-xs font-black text-etecteal-700">تقدم المعيار: ${stdPct}%</span>
                            </div>
                            <div class="p-4 space-y-4">
                    `;

                    standard.focusAreas.forEach(focus => {
                        const focusPct = calculateProgress(focus.indicators);
                        html += `
                            <div>
                                <div class="flex justify-between items-center mb-3 pb-1.5 border-b border-dashed">
                                    <h4 class="text-xs font-black text-slate-700">${focus.name}</h4>
                                    <span class="text-[11px] font-black text-accentgold">تقدم التركيز: ${focusPct}%</span>
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        `;

                        focus.indicators.forEach(ind => {
                            const colors = getColorStyles(ind.status);
                            html += `
                                <div class="border-r-2 ${colors.border} bg-slate-50/60 p-3 rounded-l text-[11px] space-y-1.5">
                                    <div class="flex justify-between items-center font-bold mb-1">

                                            ${ind.driveFolderId ? `
                                            <a href="https://drive.google.com/drive/folders/${ind.driveFolderId}" target="_blank" rel="noopener"
                                                class="flex items-center gap-1 px-1.5 py-0.5 bg-etecteal-50 border border-etecteal-200 hover:bg-etecteal-100 text-etecteal-700 rounded text-[9px] font-bold">
                                                <i class="fa-brands fa-google-drive"></i> الشواهد
                                            </a>` : ''}
                                        </div>
                                        <span class="px-2 py-0.5 rounded text-[9px] font-black tracking-wide ${colors.bg}">${colors.label}</span>
                                    </div>
                                    <p class="font-bold text-slate-800 leading-relaxed">${ind.text}</p>
                                    <div class="text-[10px] text-gray-600 space-y-1 pt-2 border-t border-dashed mt-2">
                                        <div><strong class="text-rose-700">⚠️ الفجوة المرصودة:</strong> ${ind.gap}</div>
                                        <div><strong class="text-slate-700">📂 الأدلة والشواهد:</strong> ${ind.evidence}</div>
                                        <div><strong class="text-emerald-700">💡 المبادرة التصحيحية:</strong> ${ind.initiative}</div>
                                    </div>
                                </div>
                            `;
                        });

                        html += `</div></div>`;
                    });

                    html += `</div></div>`;
                });

                html += `</div></section>`;
            });

            root.innerHTML = html;
        }

        buildFullReport();
    </script>
