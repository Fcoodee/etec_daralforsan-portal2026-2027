<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<style>
body{font-family:Tahoma,Arial,sans-serif;margin:24px;color:#16222d}
pre{background:#eef2f5;padding:12px;border-radius:8px;white-space:pre-wrap}
button{min-height:44px;padding:0 16px;font-size:15px}
</style>
</head>
<body>
<h1>تقارير الأداء — اختبار الاتصال</h1>
<p>صفحة اختبار مبدئية للتحقق من الهوية والصلاحيات قبل ربط الواجهة الكاملة.</p>
<button type="button" id="go">اختبر حسابي</button>
<pre id="out" role="status">—</pre>
<script>
document.getElementById('go').addEventListener('click', function () {
  var out = document.getElementById('out'); out.textContent = 'جارٍ التحقق…';
  google.script.run
    .withSuccessHandler(function (me) {
      google.script.run.withSuccessHandler(function (list) {
        out.textContent = 'الاسم: ' + me.name + '\nالدور: ' + me.role + '\nالمرحلة: ' + me.stage + '\nعدد الطلاب المتاحين لك: ' + list.length;
      }).withFailureHandler(function (e) { out.textContent = 'خطأ: ' + e.message; }).api_students();
    })
    .withFailureHandler(function (e) { out.textContent = 'خطأ: ' + e.message; })
    .api_me();
});
</script>
</body>
</html>
