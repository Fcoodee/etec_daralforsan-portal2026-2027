<style>
:root{--teal:#006666;--teal7:#003d3d;--gold:#c29b38;--ink:#0f172a;--mut:#64748b;--line:#94a3b8;--bg:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:12px}
button,select,input{font-family:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.bar a,.bar button{color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
.bar button.pri{background:var(--gold);color:#0f172a}
.doc{max-width:210mm;margin:12px auto;padding:0 6px 30px}

th{background:#e6f0f0;font-weight:800;color:#0f3b3b;text-align:center}
td.c{text-align:center}.bx{text-align:center;font-size:15px;line-height:1}.sys{text-align:center;font-weight:800;font-size:13px}
.sys.ok{color:#047857}.sys.part{color:#b45309}.sys.no{color:#94a3b8}
.box{border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}

ol,ul{margin:3px 0;padding-right:18px}li{margin:1px 0}
.ind{border:1.5px solid var(--teal);border-radius:8px;margin-bottom:9px;overflow:hidden;break-inside:avoid}
.ih{display:grid;grid-template-columns:auto 1fr auto auto;gap:9px;align-items:center;background:#f0fafa;padding:6px 8px;border-bottom:1px solid var(--line)}
.ih .code{font-size:17px;font-weight:900;color:var(--teal);direction:ltr;unicode-bidi:isolate}.ih .ti b{font-size:13px}.ih .ti span{font-size:10.5px;color:#475569;line-height:1.4;display:block}

.pr td{background:#f8fafc;font-weight:700}.pr .src{font-weight:600;color:#475569;font-size:10.5px}
.sub{margin:4px 0 0;font-size:10px;color:#475569;padding:2px 8px 5px}
.fn{font-size:10px;color:#334155;direction:ltr;unicode-bidi:isolate;text-align:left;padding:1px 8px}
.qr{text-align:center}.qa{display:block;line-height:0;cursor:pointer}.qa img,.qa canvas{display:inline-block}.qc{display:block;font-size:8.5px;line-height:1.3;color:#0f766e;text-decoration:underline;margin-top:2px;white-space:nowrap}a.u{color:#0f766e;text-decoration:underline}
.shots{columns:2;column-gap:14px;font-size:10px;padding:2px 8px 6px;margin:0;list-style:none}.shots li{break-inside:avoid;margin:0 0 1px}
.sig td{height:30px}.sig th{width:22%}
.line{border-bottom:1px dotted #64748b;height:20px}
.foot{font-size:9.5px;color:var(--mut);text-align:center;margin-top:8px;border-top:1px solid #cbd5e1;padding-top:3px}

  const nm=SEL.p==="A"?t.sup:(isM?t.mem[SEL.p]:"فريق المجال كاملاً"), role=SEL.p==="A"?"المشرف":(isM?"منسّق المؤشر":"المشرف والأعضاء");
  const opts={shots:document.getElementById('optShots').checked,text:document.getElementById('optText').checked};
  const regs=S.reduce((a,i)=>a+(i.p?i.p.reduce((b,p)=>b+p.regs.length,0):0),0), items=S.reduce((a,i)=>a+(i.rq?i.rq.length:0),0), paras=S.reduce((a,i)=>a+(i.p?i.p.length:0),0);
  const d=new Date(), stamp=d.toLocaleDateString("ar-SA-u-ca-gregory",{year:"numeric",month:"long",day:"numeric"})+" · "+d.toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});
  const code="HC-D"+SEL.d+"-"+(isM?"M"+(SEL.p+1):(SEL.p==="A"?"SUP":"ALL"))+"-"+d.toISOString().slice(0,10).replace(/-/g,"");
  const sig=[{n:t.sup,r:"المشرف"}].concat(SEL.p==="all"||SEL.p==="A"?t.mem.map(m=>({n:m,r:"منسّق مؤشر"})):[{n:t.mem[SEL.p],r:"منسّق المؤشر"}]);
  const head=(sub)=>`<div class="head"><img src="${LOGO0}" alt="قسم الدبلوما"><div class="tt"><h1>${sub}</h1><p>مشروع ربط الشواهد بالسجلات — مدارس دار الفرسان الأهلية — قسم الدبلوما الأمريكية (بنين) — 2026 - 2027 م</p></div><img src="${LOGO1}" alt="مدارس دار الفرسان"></div>`;
  document.getElementById('doc').innerHTML=`
  <section class="sheet cover">${head("تقرير استلام المهام")}
    <table><tr><th style="width:18%">المجال</th><td><b>${SEL.d} · ${esc(DOMAINS[SEL.d])}</b></td><th style="width:18%">المستلم</th><td><b>${esc(nm)}</b> (${role})</td></tr>
    <tr><th>المشرف</th><td>${esc(t.sup)}</td><th>الأعضاء</th><td>${t.mem.map(esc).join("، ")}</td></tr></table>
    <div class="kv"><div><b>${S.length}</b><span>مؤشراً</span></div><div><b>${paras}</b><span>فقرة</span></div><div><b>${regs+items}</b><span>سجلاً أو شاهداً مطلوباً</span></div><div><b>${S.length}</b><span>تقرير بصري على الأقل (ست صور في كل تقرير)</span></div></div>
    <div class="box"><h3>كيف تستعمل هذه الورقة؟</h3><ol>
      <li><b>اقرأ مؤشرك:</b> يبيّن لك كل مؤشر السجلات المطلوبة وممن تطلبها.</li>
      <li><b>اجمع وارفع:</b> اجمع السجل من مصدره وارفعه في مجلد المؤشر في Drive (<b>امسح رمز QR أو اضغط عليه</b> فيفتح المجلد، وهو قابل للنقر أيضاً في نسخة PDF)، وسمِّه وفق قاعدة التسمية.</li>
      <li><b>أشّر بقلمك ✔ هنا</b> في الخانة المقابلة فور إنجاز الخطوة، وأنشئ التقرير البصري بست صور، ثم سلّم الورقة إلى منظّم المشروع.</li></ol></div>
    <div class="box"><h3>معنى الخانات</h3><b>جُمع</b>: حصلتُ على الملف من مصدره · <b>رُفع</b>: رفعتُه في مجلد المؤشر · <b>سُمّي</b>: اسمه يطابق القاعدة (رمز المؤشر_ف رقم الفقرة_اسم السجل_…) · <b>تُحقق</b>: فحصتُه أو فحصه المنسّق · <b>النظام</b>: ما تقرؤه لوحة المتابعة وقت الطباعة (✔ منجز · ◐ جزء · ○ لا شيء · — غير متصل).</div>
    <div class="box" style="display:flex;gap:10px;align-items:center"><div class="qr" data-q="${esc(REF_URL)}" data-s="76"></div><div><h3>مرجع الشواهد المؤمَّنة (درايف مكتب الإشراف والتطوير)</h3>هذا الرابط يخدم <b>تغذية التقرير البصري للمؤشر فقط</b>: افتحه للحصول على الصور المناسبة لتقرير المؤشر، ولا ترفع إليه ملفات هذا المشروع.<div class="fn" style="padding:0"><a class="u" href="${esc(REF_URL)}" target="_blank" rel="noopener">${esc(REF_URL)}</a></div></div></div>
    <div class="foot">رمز الإصدار: <b dir="ltr" style="unicode-bidi:isolate">${code}</b> · طُبعت: ${stamp} · ${LINKED?"قُرئت حالة النظام وقت الطباعة":"حالة النظام غير متصلة وقت الطباعة"} · لوحة داخلية للمدرسة ولا تحل محل منصة التقويم المدرسي الرسمية</div>
  </section>
  <section class="sheet">${S.map(i=>indHTML(i,opts)).join("")||'<div class="box">لا مؤشرات في هذا النطاق.</div>'}</section>
  <section class="sheet ack">${head("إقرار استلام المهام")}
    <div class="box">أقرّ أنا الموقّع أدناه بأنني <b>استلمتُ المهام الموضحة</b> في هذا التقرير (${S.length} مؤشراً)، والتزمتُ بجمع السجلات والشواهد المطلوبة ورفعها في مجلدات المؤشرات في Drive وفق قاعدة التسمية، وإنشاء التقارير البصرية بست صور في كل تقرير، وبألا أُظهر وجه طالب إلا بموافقة ولي أمره، وألا أرفع بيانات حساسة أو حالات فردية.</div>
    <table class="sig"><tr><th>الصفة</th><th>الاسم</th><th>التوقيع</th><th>التاريخ</th></tr>${sig.map(s=>`<tr><td class="c">${s.r}</td><td>${esc(s.n)}</td><td></td><td></td></tr>`).join("")}</table>
    <div class="foot">رمز الإصدار: <b dir="ltr" style="unicode-bidi:isolate">${code}</b></div>
  </section>
  <section class="sheet hand">${head("تسليم التقرير إلى منظّم المشروع")}
    <div class="box"><h3>ملخص الإنجاز كما أُشِّر في هذه الورقة</h3>
      <table class="sig"><tr><th>البند</th><th>العدد في الورقة</th><th>العدد في النظام</th><th>الفرق / ملاحظة</th></tr>
      <tr><td>السجلات والشواهد المرفوعة (من ${regs+items})</td><td></td><td></td><td></td></tr><tr><td>التي سُمّيت وفق القاعدة</td><td></td><td></td><td></td></tr><tr><td>التي تُحقق منها</td><td></td><td></td><td></td></tr>
      <tr><td>التقارير البصرية المنجزة (من ${S.length} على الأقل)</td><td></td><td></td><td></td></tr></table></div>
    <div class="box"><h3>العوائق والاحتياجات</h3><div class="line"></div><div class="line"></div><div class="line"></div></div>
    <div class="box"><h3>ملاحظات على قاعدة التسمية أو ما يُنصح بتصويره</h3><div class="line"></div><div class="line"></div></div>
    <table class="sig"><tr><th>سلّم</th><td>الاسم: ${esc(nm)}</td><th>التوقيع</th><td></td><th>التاريخ</th><td></td></tr>
    <tr><th>استلم: منظّم المشروع (مهندس بيانات النظام)</th><td>الاسم: ${ORG?esc(ORG):"........................"}</td><th>التوقيع</th><td></td><th>التاريخ</th><td></td></tr></table>
    <div class="foot">رمز الإصدار: <b dir="ltr" style="unicode-bidi:isolate">${code}</b></div>
  </section>`;
  document.querySelectorAll('#doc .qr').forEach(el=>{ const s=+(el.dataset.s||58), url=el.dataset.q; el.innerHTML="";
    const a=document.createElement("a"); a.className="qa"; a.href=url; a.target="_blank"; a.rel="noopener"; a.title="اضغط لفتح المجلد في Drive"; a.setAttribute("aria-label","رمز QR: اضغط أو امسح لفتح المجلد في Drive"); el.appendChild(a);
    try{ new QRCode(a,{text:url,width:s,height:s,correctLevel:QRCode.CorrectLevel.L}); }catch(e){}
    if(!el.dataset.s){ const c=document.createElement("a"); c.className="qc"; c.href=url; c.target="_blank"; c.rel="noopener"; c.textContent="افتح المجلد"; el.appendChild(c); } });
}
/* ---- محدّدات المجال والمستلم + الرابط ---- */
function fillPickers(){
  selD.innerHTML=Object.keys(DOMAINS).map(d=>`<option value="${d}">المجال ${d} · ${DOMAINS[d]}</option>`).join(""); selD.value=SEL.d;
  const t=TEAMS[SEL.d]; selP.innerHTML=`<option value="all">كل الفريق (نسخة المشرف)</option><option value="A">المشرف: ${t.sup}</option>`+t.mem.map((m,x)=>`<option value="${x}">${m}</option>`).join(""); selP.value=String(SEL.p);
}
function sync(){ try{ const u=new URL(location.href); u.searchParams.set("d",SEL.d); u.searchParams.set("m",SEL.p); history.replaceState(null,"",u); }catch(e){} }
(function init(){ const q=new URLSearchParams(location.search), d=+q.get("d"); if(TEAMS[d]) SEL.d=d; const m=q.get("m"); if(m==="A"||m==="all") SEL.p=m; else if(/^\d$/.test(m||"")&&TEAMS[SEL.d].mem[+m]) SEL.p=+m;
  fillPickers(); render();
  selD.onchange=()=>{ SEL={d:+selD.value,p:"all"}; fillPickers(); sync(); render(); };
  selP.onchange=()=>{ const v=selP.value; SEL.p=(v==="all"||v==="A")?v:+v; sync(); render(); };
  optShots.onchange=optText.onchange=render; printBtn.onclick=()=>window.print();
  if(q.get("demo")==="1"){ let s=7; const r=()=>{ s=(s*9301+49297)%233280; return s/233280; }; DATA.forEach(i=>{ if(i.p) i.p.forEach(p=>p.regs.forEach(g=>{ const k="P"+pad2(p.n)+"|"+g, n=r()<0.5?1+Math.floor(r()*2):0; ST.registers[k]=n; ST.named[k]=n?(r()<.7?n:0):0; ST.verified[k]=ST.named[k]?(r()<.5?n:0):0; })); else i.rq.forEach((t,k)=>{ const key="E|"+i.code+"|"+(k+1), n=r()<.4?1:0; ST.ev[key]=n; ST.evNamed[key]=n; ST.evVer[key]=r()<.5?n:0; }); const rr=r()<.4?[{ok:true,n:6,ver:r()<.5}]:[]; ST.reportsList[i.code]=rr; }); LINKED=true; render(); }
  else if(STATUS_URL){ const cb="__hc"+Date.now(), sc=document.createElement("script"); window[cb]=d=>{ ST=Object.assign(ST,{registers:d.registers||{},named:d.named||{},verified:d.verified||{},ev:d.ev||{},evNamed:d.evNamed||{},evVer:d.evVer||{},reportsList:d.reportsList||{}}); LINKED=true; render(); }; sc.src=STATUS_URL+(STATUS_URL.includes("?")?"&":"?")+"callback="+cb; document.body.appendChild(sc); }
})();
</script>
