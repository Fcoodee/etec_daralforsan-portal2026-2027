<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script src="shield.js?v=10.8.12"></script>
<script src="fx.js?v=10.8.12"></script>
<script src="page-gate.js?v=10.8.12" data-always="1" data-detach="0" data-title="المنصة مغلقة حالياً" data-msg="الدخول متاح لمدير النظام فقط في هذه المرحلة. أدخل بيانات دخول مدير النظام."></script>
<script src="admin-only.js?v=10.8.12"></script>
<meta name="robots" content="noindex,nofollow">
<title>تتبع الوثائق ومصادر بيانات السجلات — مدارس دار الفرسان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="phase.css?v=10.8.12">
<script src="portal-meta.js?v=10.8.12"></script>
<script src="portal-role.js?v=10.8.12"></script>
<style>.sr-ok{color:#047857;font-weight:700}.sr-ca{color:#b45309;font-weight:700}.sr-se{color:#1d4ed8;font-weight:700}.sr-no{color:#b91c1c;font-weight:700}.sr-n{font-size:12px;color:#475569;line-height:1.6}
.sr-k{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.sr-k div{flex:1;min-width:130px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:8px 12px}.sr-k b{display:block;font-size:22px}.sr-k small{color:#475569;font-weight:700}
.sr-d{font-size:12.5px;color:#334155;margin:4px 0 10px;line-height:1.9}.sr-d span{display:inline-block;margin-inline-end:14px}.sr-act{margin:8px 0;display:flex;gap:8px;flex-wrap:wrap}.sr-pr{display:none;font-size:13px;color:#334155}@media print{.sr-act{display:none!important}.sr-pr{display:block}.ph-tw{overflow:visible;border:0}.ph-rt{min-width:0;font-size:11px}.sr-k div{break-inside:avoid}tr{break-inside:avoid}}</style>
</head>
<body>
<div id="chrome"></div>
<main class="ph-main">
  <h1 class="ph-h1">تتبع الوثائق ومصادر بيانات السجلات</h1>
  <p class="ph-lead">حالة مصدر البيانات لكل سجل، وتطور العمل على إيجاد مصادر تغذّيه. تُحدَّث الصفحة بالتزامن مع العمل.</p>
  <div class="sr-act ad-only"><button type="button" class="ph-btn" id="exPdf"><i class="fa-solid fa-file-pdf"></i> تصدير تقرير للإدارة (PDF / طباعة)</button> <button type="button" class="ph-btn" id="exCsv"><i class="fa-solid fa-file-csv"></i> تصدير CSV</button></div>
  <p class="sr-pr" id="pr"></p>
  <div id="kp" class="sr-k"></div>
  <div id="dm" class="sr-d"></div>
  <div class="ph-filters" role="search">
    <input id="q" type="search" placeholder="ابحث بالرمز أو اسم السجل…" aria-label="بحث">
    <select id="fs" aria-label="حالة المصدر"><option value="">الحالة: الكل</option><option value="ok">مكتمل المصادر</option><option value="candidate">مرشّح بانتظار القرار</option><option value="searching">جارٍ البحث</option><option value="none">لا يوجد له مصدر حتى الآن</option></select>
    <select id="fd" aria-label="المجال"><option value="">كل المجالات</option></select>
  </div>
  <div id="sum" class="ph-lead" role="status" aria-live="polite"></div>
  <div class="ph-tw"><table class="ph-rt"><caption class="sr">مصادر بيانات السجلات</caption>
    <thead><tr><th scope="col">المؤشر</th><th scope="col">السجل</th><th scope="col">حالة المصدر</th><th scope="col">حالة السجل</th><th scope="col">المصدر / التنويه</th><th scope="col">آخر تحديث</th></tr></thead>
    <tbody id="tb"></tbody></table></div>
</main>
<script src="portal-config.js?v=10.8.12"></script>
<script src="portal-names.js?v=10.8.12"></script>
<script src="phase-data.js?v=10.8.12"></script>
<script src="record-sources.js?v=10.8.12"></script>
<script src="phase-core.js?v=10.8.12"></script>
<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, S = window.ETEC_SRC || {};
  P.chrome("sources.html");
  var L = { ok: ["مكتمل المصادر", "sr-ok"], candidate: ["مرشّح بانتظار القرار", "sr-ca"], searching: ["جارٍ البحث", "sr-se"], none: ["لا يوجد له مصدر حتى الآن", "sr-no"] };
  var q = document.getElementById("q"), fs = document.getElementById("fs"), fd = document.getElementById("fd"), tb = document.getElementById("tb"), sum = document.getElementById("sum"), kp = document.getElementById("kp"), dm = document.getElementById("dm");
  [1, 2, 3, 4].forEach(function (d) { fd.insertAdjacentHTML("beforeend", '<option value="' + d + '">' + E(P.DN[d]) + "</option>"); });
  var rows = [];
  function build() { rows = [];
  P.PH.inds.forEach(function (i) { i.recs.forEach(function (n) { var e = S[i.code + "|" + n] || { s: "none" }; rows.push({ rs: (P.sOf(i).st || {})[n] || "blank", d: i.d, code: i.code, st: i.st, n: n, s: e.s, t: e.s === "ok" ? (e.src || "") : (e.note || ""), u: e.d || "", l: e.l || "" }); }); }); }
  build();
  function cnt(f) { var c = { ok: 0, candidate: 0, searching: 0, none: 0 }; rows.filter(f).forEach(function (r) { c[r.s]++; }); return c; }
  function draw() {
    document.getElementById("pr").textContent = "تقرير تتبع مصادر بيانات السجلات — مدارس دار الفرسان · الدبلوما الأمريكية (بنين) · " + new Date().toLocaleDateString("ar-SA-u-ca-gregory");
    var t = q.value.trim().toLowerCase(), v = rows.filter(function (r) { return (!fs.value || r.s === fs.value) && (!fd.value || r.d === +fd.value) && (!t || (r.code + " " + r.n + " " + r.st).toLowerCase().indexOf(t) >= 0); });
    var c = cnt(function () { return true; });
    kp.innerHTML = ["ok", "candidate", "searching", "none"].map(function (k) { return '<div><b class="' + L[k][1] + '">' + c[k] + "</b><small>" + L[k][0] + "</small></div>"; }).join("") + '<div><b>' + rows.length + "</b><small>إجمالي السجلات</small></div>";
    dm.innerHTML = [1, 2, 3, 4].map(function (d) { var x = cnt(function (r) { return r.d === d; }), n = x.ok + x.candidate + x.searching + x.none; return "<span><b>" + E(P.DN[d]) + ":</b> " + x.ok + " مكتمل من " + n + "</span>"; }).join("");
    tb.innerHTML = v.map(function (r) {
      return "<tr><td>" + E(r.code) + '<div class="sr-n">' + E(r.st) + '</div></td><th scope="row" class="ph-rn">' + E(r.n) + '</th><td class="' + L[r.s][1] + '">' + L[r.s][0] + '</td><td>' + P.chip(r.rs) + '</td><td class="sr-n">' + E(r.t) + (r.l ? ' <a href="' + E(r.l) + '" target="_blank" rel="noopener">المرشّح</a>' : "") + '</td><td class="sr-n">' + E(r.u || "—") + "</td></tr>"; }).join("");
    sum.textContent = "المعروض: " + v.length + " من " + rows.length;
  }
  function csv() {
    var h = ["المجال", "رمز المؤشر", "المؤشر", "السجل", "حالة المصدر", "حالة السجل", "المصدر/التنويه", "رابط المرشّح", "آخر تحديث"];
    var out = [h].concat(rows.map(function (r) { return [P.DN[r.d], r.code, r.st, r.n, L[r.s][0], (P.STATE[r.rs] && P.STATE[r.rs].t) || r.rs, r.t, r.l, r.u]; }));
    var txt = "\ufeff" + out.map(function (a) { return a.map(function (c) { return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" })); a.download = "تتبع_مصادر_السجلات_" + new Date().toISOString().slice(0, 10) + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById("exPdf").addEventListener("click", function () { window.print(); });
  document.getElementById("exCsv").addEventListener("click", csv);
  P.onStatus(function () { build(); draw(); });
  q.addEventListener("input", draw); fs.addEventListener("change", draw); fd.addEventListener("change", draw); draw();
})();
</script>
</body>
</html>
