<style>
:root{--teal:#006666;--teal7:#003d3d;--gold:#c29b38;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--ok:#047857;--okbg:#ecfdf5;--warn:#92400e;--warnbg:#fffbeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
button,select,a{font-family:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{background:#0f172a;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
.top b{font-size:15px;font-weight:800}.top .sp{flex:1}
.top a{color:#fff;text-decoration:none;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:999px}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}
select{width:100%;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;color:var(--ink);font-size:13px;margin-bottom:12px}
.hub{background:linear-gradient(135deg,#003d3d,#0f172a);color:#fff;border-radius:18px;padding:18px 16px;text-align:center}
.hub .path{font-size:12px;color:#99f6e4;font-weight:700}
.hub .code{font-size:26px;font-weight:800;direction:ltr;unicode-bidi:isolate;color:#fde68a;margin-top:2px}
.hub .txt{font-size:15px;font-weight:700;line-height:1.7;margin-top:2px}
.hub .who{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid transparent}
.pill.r{background:#d1fae5;color:#065f46}.pill.a{background:#ffedd5;color:#9a3412}
.ready{margin-top:14px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;text-align:right}
.ready .row{display:flex;align-items:center;gap:10px;font-size:12px;margin:5px 0}
.ready .row span:first-child{width:120px;flex-shrink:0;color:#cbd5e1}
.bar{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2dd4bf,#fde68a);border-radius:99px}
.ready .v{width:42px;text-align:left;font-weight:800;color:#fde68a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card.wide{grid-column:1/-1}
.card h2{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2 i{color:var(--teal)}
.sub{font-size:12px;color:var(--mut);margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:6px 14px;border:1px solid #cbd5e1;background:#fff;color:#334155;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--teal7);border-color:var(--teal7);color:#fff}.btn:hover{filter:brightness(.97)}
details{margin-top:6px}summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--teal7);list-style:none}
summary::-webkit-details-marker{display:none}
.li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid #cbd5e1;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:transparent;margin-top:3px}
.ck.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip{display:inline-flex;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 8px;margin:1px}
.chip.p{background:#e0f2fe;color:#075985}.chip.d{background:#fef3c7;color:#92400e}.chip.e{background:var(--okbg);color:var(--ok)}.chip.x{background:#f1f5f9;color:var(--mut)}
.note{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:10px;padding:7px 10px;font-size:12px;margin:6px 0}
.tag{font-size:10.5px;color:var(--warn);background:var(--warnbg);border:1px solid #fde68a;border-radius:999px;padding:0 8px;font-weight:700}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#qr a{display:block;line-height:0;cursor:pointer}#qr{width:132px;height:132px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center}
.foot{margin-top:14px;font-size:11.5px;color:var(--mut);line-height:1.8}
</style>

  let reg="";
  if(x.p){ reg=x.p.map(p=>`<div style="margin-top:6px"><b style="font-size:12px;color:var(--teal7)">الفقرة ${p.n}</b><span style="font-size:11.5px;color:var(--mut)"> · ${esc(p.text)}</span>${p.regs.map(r=>{const n=STATUS.registers["P"+pad2(p.n)+"|"+r]||0; return `<div class="li"><span class="ck ${n>0?'on':''}"><i class="fa-solid fa-check"></i></span><span style="flex:1">${esc(r)}</span><span style="font-size:10.5px;color:var(--mut)">${n>0?n+' ملف':''}</span></div>`;}).join("")}</div>`).join(""); }
  else { reg=`<div class="li"><span class="ck ${(STATUS.tools[x.code]||0)>0?'on':''}"><i class="fa-solid fa-check"></i></span><span style="flex:1">شواهد داعمة · أداة القياس: ${esc(x.tool)}</span></div>`+(x.g?`<div style="margin-top:6px"><span class="tag">وثائق نقترح رفعها · إضاءات من دليل فبراير 2026</span>${x.g.map(d=>{const n=STATUS.guide["G|"+x.code+"|"+d.n]||0; return `<div class="li"><span class="ck ${n>0?'on':''}"><i class="fa-solid fa-check"></i></span><span style="flex:1">${esc(d.t)}</span><span style="font-size:10.5px;color:var(--mut)">إضاءة ${d.n}</span></div>`;}).join("")}</div>`:""); }
  const shots=x.gd.map((s,k)=>`<div class="li"><span style="width:22px;height:22px;border-radius:50%;background:${k>=6?'#64748b':'#0f172a'};color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0">${k+1}</span><span style="flex:1">${esc(s.t)}<br><span class="chip ${s.k}">${s.k==='p'?'صورة':'لقطة وثيقة'}</span>${s.e.length?`<span class="chip e">إضاءة ${s.e.join("، ")}</span>`:""}<span class="chip x">${k<6?'تظهر في الشبكة':'إضافية'}</span></span></div>`).join("");
  const ph=Math.min(STATUS.photos[x.code]||0,6), rp=STATUS.reports[x.code]||0;
  document.getElementById('cards').innerHTML=`
   <div class="card wide"><h2><i class="fa-solid fa-files"></i> السجلات الداعمة${x.p?'':' (مؤشر خارج تقرير السجلات)'}</h2><p class="sub">${x.p?'السجل المطلوب في كل فقرة، وتظهر العلامة ✓ عند رفعه':'لا سجلات لهذا المؤشر في تقرير مصادر السجلات'}</p><div>${reg}</div>
     <p style="margin:8px 0 0"><a class="btn pri" href="${FOLDER(x.f)}" target="_blank" rel="noopener"><i class="fa-brands fa-google-drive"></i> فتح مجلد المؤشر</a></p></div>
   <div class="card"><h2><i class="fa-solid fa-camera"></i> الصور ولقطات الوثائق</h2><p class="sub">${val(ph)} من ٦ صور أو لقطات وثائق</p><details><summary>ما يُنصح بتصويره (${x.gd.length} لقطة)</summary>${x.gn?`<div class="note"><i class="fa-solid fa-shield-halved"></i> ${esc(x.gn)}</div>`:""}${shots}</details></div>
   <div class="card"><h2><i class="fa-solid fa-file-pdf"></i> التقرير البصري</h2><p class="sub">${val(rp)} تقرير في المجلد</p><p style="margin:0;font-size:12px;color:var(--mut)">قالب موحّد: بطاقة المؤشر، والسجل الداعم نصاً، وست صور، والتواقيع.</p></div>
   <div class="card"><h2><i class="fa-solid fa-user-tag"></i> ممن نطلب السجلات ومن المسؤول</h2><p class="sub">الجهة التي تسلّم السجلات، وفريق العمل</p><div>${srcChips(x)}</div><p style="margin:8px 0 0;font-size:12px">منسّق المؤشر: <b>${esc(x.r)}</b><br>المشرف: <b>${esc(x.a)}</b></p></div>
   <div class="card"><h2><i class="fa-solid fa-user-check"></i> مراجعة المشرف</h2><p class="sub">يراجع المشرف المؤشر ويُقرّه</p><p style="margin:0;font-size:12px;color:var(--mut)">تتم المراجعة خارج هذه الصفحة.</p></div>
   <div class="card wide"><h2><i class="fa-solid fa-qrcode"></i> رمز QR لهذا المؤشر</h2><p class="sub">اضغط عليه أو امسحه لفتح مجلد المؤشر في Drive، وضعه في التقرير البصري</p>
     <div class="qrbox"><div id="qr"></div><div style="display:flex;flex-direction:column;gap:8px"><button class="btn pri" id="dl"><i class="fa-solid fa-download"></i> تنزيل الصورة (PNG)</button><button class="btn" id="cp"><i class="fa-regular fa-copy"></i> نسخ الرابط</button><a href="${FOLDER(x.f)}" target="_blank" rel="noopener" style="font-size:11px;color:#0f766e;direction:ltr;text-align:right;word-break:break-all">${FOLDER(x.f)}</a></div></div></div>`;
  const q=document.getElementById('qr'); q.innerHTML="";
  try{ const ql=document.createElement("a"); ql.href=FOLDER(x.f); ql.target="_blank"; ql.rel="noopener"; ql.title="اضغط لفتح مجلد المؤشر في Drive"; ql.setAttribute("aria-label","رمز QR: اضغط أو امسح لفتح مجلد المؤشر في Drive"); q.appendChild(ql); new QRCode(ql,{text:FOLDER(x.f),width:120,height:120,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ q.innerHTML='<i class="fa-solid fa-qrcode" style="font-size:60px;color:#94a3b8"></i>'; }
  document.getElementById('dl').onclick=()=>{ const c=q.querySelector('canvas'); const u=c?c.toDataURL('image/png'):(q.querySelector('img')||{}).src; if(!u) return; const a=document.createElement('a'); a.href=u; a.download='QR-'+x.code+'.png'; a.click(); };
  document.getElementById('cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(FOLDER(x.f)); document.getElementById('cp').textContent='تم النسخ'; }catch(e){} };
}
sel.onchange=()=>render(sel.value);
function load(){
  if(!STATUS_URL){ render(new URLSearchParams(location.search).get('i')||DATA[0].code); return; }
  const cb="__cv"+Date.now(), s=document.createElement('script'); const t=setTimeout(()=>{ s.remove(); },90000);
  window[cb]=d=>{ clearTimeout(t); STATUS={registers:d.registers||{},tools:d.tools||{},guide:d.guide||{},photos:d.photos||{},reports:d.reports||{}}; LINKED=true; delete window[cb]; s.remove(); render(cur?cur.code:(new URLSearchParams(location.search).get('i')||DATA[0].code)); };
  s.onerror=()=>{ clearTimeout(t); };
  s.src=STATUS_URL+(STATUS_URL.includes("?")?"&":"?")+"callback="+cb; document.body.appendChild(s);
  render(new URLSearchParams(location.search).get('i')||DATA[0].code);
}
load();
</script>
<script src="page-gate.js" data-lazy="1"></script>
<script src="legal-notice.js"></script>
<script src="content-protect.js"></script>
