<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>المؤشرات والسجلات — مشروع الاعتماد 2026-2027 — مدارس دار الفرسان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="phase.css?v=9.6.3">
<script src="portal-meta.js?v=9.6.3"></script>
<script src="portal-role.js?v=9.6.3"></script>
</head>
<body>
<div id="chrome"></div>
<main class="ph-main">
  <h1 class="ph-h1">المؤشرات والسجلات</h1>
  <p class="ph-lead">كل المؤشرات (52) وسجلاتها (140) وحالة كل سجل. افتح أي مؤشر لترى سجلاته ومجلده.</p>
  <div class="ph-filters" role="search">
    <input id="q" type="search" placeholder="ابحث بالرمز أو الاسم أو السجل…" aria-label="بحث">
    <select id="fd" aria-label="المجال"><option value="">كل المجالات</option></select>
    <select id="fs" aria-label="حالة السجلات"><option value="">السجلات: الكل</option><option value="none">لم تبدأ التعبئة</option><option value="review">فيها سجلات قيد المراجعة</option><option value="approved">فيها سجلات مرفوعة</option><option value="done">كل سجلاتها مرفوعة</option></select>
    <select id="fr" aria-label="حالة التقرير"><option value="">التقرير: الكل</option><option value="norep">لم يُرفع</option><option value="linked">مرفوع</option></select>
    <select id="fo" aria-label="المسؤول"><option value="">كل المسؤولين</option></select>
    <button type="button" class="ph-pill" id="mine" aria-pressed="false" hidden>مؤشراتي فقط</button>
  </div>
  <div id="sum" class="ph-lead" role="status" aria-live="polite"></div>
  <div id="list"></div>
</main>

<script src="portal-config.js?v=9.6.3"></script>
<script src="portal-names.js?v=9.6.3"></script>
<script src="phase-data.js?v=9.6.3"></script>
<script src="phase-core.js?v=9.6.3"></script>
<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, role = window.PortalRole ? PortalRole.get() : "";
  P.chrome("indicators.html");
  var q = document.getElementById("q"), fd = document.getElementById("fd"), fs = document.getElementById("fs"), fr = document.getElementById("fr"), fo = document.getElementById("fo"), mine = document.getElementById("mine"), list = document.getElementById("list"), sum = document.getElementById("sum");
  var url = new URLSearchParams(location.search), focus = url.get("code") || "", me = P.me.get(), onlyMine = false, first = true;
  [1, 2, 3, 4].forEach(function (d) { fd.insertAdjacentHTML("beforeend", '<option value="' + d + '">' + E(P.DN[d]) + "</option>"); });
  [1, 2, 3, 4].forEach(function (d) { var T = P.PH.teams[d]; fo.insertAdjacentHTML("beforeend", '<optgroup label="' + E(P.DN[d]) + '">' + T.mem.map(function (n, x) { return '<option value="' + d + "|" + x + '">' + E(n) + "</option>"; }).join("") + "</optgroup>"); });
  if (url.get("d") && P.PH.teams[url.get("d")]) fd.value = url.get("d");
  if (role === "member" && me && me.idx >= 0) { mine.hidden = false; onlyMine = true; mine.setAttribute("aria-pressed", "true"); }
  else if (role === "sup" && me) { fd.value = String(me.d); }

  function match(i) {
    var s = P.sOf(i), t = q.value.trim().toLowerCase();
    if (fd.value && i.d !== +fd.value) return false;
    if (fo.value) { var p = fo.value.split("|"); if (i.d !== +p[0] || i.own !== +p[1]) return false; }
    if (onlyMine && me && !(i.d === me.d && i.own === me.idx)) return false;
    if (t && (i.code + " " + i.st + " " + i.cn + " " + i.text + " " + i.recs.join(" ")).toLowerCase().indexOf(t) < 0) return false;
    switch (fs.value) {
      case "none": if (s.up > 0 || s.ap > 0) return false; break;
      case "review": if (!s.review) return false; break;
      case "approved": if (!s.ap) return false; break;
      case "done": if (s.ap < s.req) return false; break;
    }
    switch (fr.value) {
      case "norep": if (s.repState !== "none") return false; break;
      case "linked": if (s.repState !== "done") return false; break;
    }
    return true;
  }
  function draw() {
    var a = P.PH.inds.filter(match), t = P.totals(a);
    sum.textContent = a.length + " مؤشراً · " + t.req + " سجلاً · منشأة " + t.cr + " · مرفوعة (بعد المراجعة) " + t.ap + " · معبّأة قيد المراجعة " + t.review;
    list.innerHTML = a.length ? a.map(function (i) { return P.card(i, { open: i.code === focus }); }).join("") : '<div class="ph-empty">لا توجد مؤشرات تطابق هذا التصفية.</div>';
    if (window.PortalRole) { var els = list.querySelectorAll("[data-roles]"); for (var k = 0; k < els.length; k++) els[k].classList.toggle("pr-off", !!role && els[k].getAttribute("data-roles").split(",").indexOf(role) < 0); }
    if (first && focus) { var el = document.getElementById("i-" + focus); if (el) el.scrollIntoView({ block: "center" }); }
    first = false;
  }
  P.bindCards(list);
  [q, fd, fs, fr, fo].forEach(function (c) { c.addEventListener(c === q ? "input" : "change", function () { focus = ""; draw(); }); });
  mine.addEventListener("click", function () { onlyMine = !onlyMine; mine.setAttribute("aria-pressed", String(onlyMine)); draw(); });
  P.onStatus(draw);
  P.load();
})();
</script>
<script src="page-gate.js" data-lazy="1"></script>
<script src="legal-notice.js"></script>
<script src="content-protect.js"></script>
</body>
</html>
