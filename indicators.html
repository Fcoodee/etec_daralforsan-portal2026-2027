<!DOCTYPE html>
<html lang="ar" dir="rtl" style="color-scheme:light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>المؤشرات والسجلات — مشروع الاعتماد 2026-2027 — مدارس دار الفرسان</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="phase.css?v=9.8.13">
<script>/* حارس الإصدار: إن كانت الصفحة محفوظة قديمة في المتصفح تُعاد من الخادم مرة واحدة */
(function(){try{var m=document.querySelector('script[src*="portal-meta.js"]');var cur=m&&(m.getAttribute("src").match(/v=([\d.]+)/)||[])[1];if(!cur)return;
fetch(location.pathname+"?_cb="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){var n=(t.match(/portal-meta\.js\?v=([\d.]+)/)||[])[1];
if(n&&n!==cur&&sessionStorage.getItem("etec.rf")!==n){sessionStorage.setItem("etec.rf",n);var u=new URL(location.href);u.searchParams.set("_r",Date.now());location.replace(u.toString());}}).catch(function(){});}catch(e){}})();
</script>
<script src="portal-meta.js?v=9.8.13"></script>
<script src="portal-role.js?v=9.8.13"></script>
</head>
<body>
<div id="chrome"></div>
<main class="ph-main">
  <h1 class="ph-h1">المؤشرات والسجلات</h1>
  <p class="ph-lead">كل المؤشرات (52) وسجلاتها (140) وحالة كل سجل. افتح أي مؤشر لترى سجلاته ومجلده.</p>
  <section id="mysp" aria-label="مساحتي" hidden></section>
  <div class="ph-filters" role="search">
    <input id="q" type="search" placeholder="ابحث بالرمز أو الاسم أو السجل…" aria-label="بحث">
    <select id="fd" aria-label="المجال"><option value="">كل المجالات</option></select>
    <select id="fs" aria-label="حالة السجلات"><option value="">السجلات: الكل</option><option value="none">لم تبدأ التعبئة</option><option value="uploaded">فيها سجلات مرفوعة (قيد المراجعة أو معتمدة أو أُعيدت)</option><option value="returned">فيها سجلات أُعيدت للتعبئة</option><option value="review">فيها سجلات قيد المراجعة</option><option value="approved">فيها سجلات معتمدة (بعد المراجعة)</option><option value="done">كل سجلاتها معتمدة</option></select>
    <select id="fr" aria-label="حالة التقرير"><option value="">التقرير: الكل</option><option value="norep">لم يُرفع</option><option value="linked">مرفوع</option></select>
    <select id="fo" aria-label="المسؤول"><option value="">كل المسؤولين</option></select>
    <button type="button" class="ph-pill" id="mine" aria-pressed="false" hidden>مؤشراتي فقط</button>
  </div>
  <div id="sum" class="ph-lead" role="status" aria-live="polite"></div>
  <div id="list"></div>
</main>

<script src="portal-config.js?v=9.8.13"></script>
<script src="portal-names.js?v=9.8.13"></script>
<script src="phase-data.js?v=9.8.13"></script>
<script src="phase-core.js?v=9.8.13"></script>
<script>
(function () {
  "use strict";
  var P = window.PHC, E = P.esc, role = window.PortalRole ? PortalRole.get() : "";
  P.chrome("indicators.html");
  var q = document.getElementById("q"), fd = document.getElementById("fd"), fs = document.getElementById("fs"), fr = document.getElementById("fr"), fo = document.getElementById("fo"), mine = document.getElementById("mine"), list = document.getElementById("list"), sum = document.getElementById("sum");
  var url = new URLSearchParams(location.search), focus = url.get("code") || "", me = P.me.get(), onlyMine = false, first = true;
  [1, 2, 3, 4].forEach(function (d) { fd.insertAdjacentHTML("beforeend", '<option value="' + d + '">' + E(P.DN[d]) + "</option>"); });
  [1, 2, 3, 4].forEach(function (d) { var T = P.PH.teams[d]; fo.insertAdjacentHTML("beforeend", '<optgroup label="' + E(P.DN[d]) + '">' + T.mem.map(function (n, x) { return '<option value="' + d + "|" + x + '">' + E(n) + "</option>"; }).join("") + "</optgroup>"); });
  if (url.get("d") && P.PH.teams[url.get("d")]) fd.value = url.get("d");
  /* العضو لا يرى إلا مجاله ومؤشراته وسجلاته: تُزال فلاتر المجال والمسؤول وزر «مؤشراتي فقط» ويُفرض التصفية */
  if (role === "member") { onlyMine = true; fd.remove(); fo.remove(); mine.remove(); document.querySelector(".ph-lead").textContent = "مؤشراتك وسجلاتك وحالة كل سجل ومجلده."; }
  else if (role === "sup" && me) { fd.value = String(me.d); }
  if (role !== "member" && /^[1-4]\|\d$/.test(url.get("o") || "")) { fo.value = url.get("o"); fd.value = url.get("o").split("|")[0]; }

  function match(i) {
    var s = P.sOf(i), t = q.value.trim().toLowerCase();
    if (fd.value && i.d !== +fd.value) return false;
    if (fo.value) { var p = fo.value.split("|"); if (i.d !== +p[0] || i.own !== +p[1]) return false; }
    if (role === "member" && !(me && me.idx >= 0 && i.d === me.d && i.own === me.idx)) return false;
    if (onlyMine && me && !(i.d === me.d && i.own === me.idx)) return false;
    if (t && (i.code + " " + i.st + " " + i.cn + " " + i.text + " " + i.recs.join(" ")).toLowerCase().indexOf(t) < 0) return false;
    switch (fs.value) {
      case "none": if (s.up > 0 || s.ap > 0) return false; break;
      case "uploaded": if (!i.recs.some(function (n) { return s.st[n] === "review" || s.st[n] === "approved" || s.st[n] === "returned"; })) return false; break;
      case "returned": if (!i.recs.some(function (n) { return s.st[n] === "returned"; })) return false; break;
      case "review": if (!s.review) return false; break;
      case "approved": if (!s.ap) return false; break;
      case "done": if (s.ap < s.req) return false; break;
    }
    switch (fr.value) {
      case "norep": if (s.repState !== "none") return false; break;
      case "linked": if (s.repState !== "done") return false; break;
    }
    return true;
  }
  /* مساحتي (للعضو): مربع أعلى الصفحة — تقدّمي وتنبيهات المشرف؛ يُفتح تلقائياً عند وجود سجلات أُعيدت إليّ */
  var mysp = document.getElementById("mysp"), myOpen = null, myTouched = false;
  function renderMy() {
    if (role !== "member") { mysp.hidden = true; return; }
    me = P.me.get(); mysp.hidden = false;
    if (!me || me.idx < 0) {
      mysp.innerHTML = '<div class="ph-my"><b>مساحتي · حدّد اسمك مرة واحدة</b><div class="ph-mypick"><select id="myd" aria-label="المجال">' + [1, 2, 3, 4].map(function (d) { return '<option value="' + d + '">' + E(P.DN[d]) + "</option>"; }).join("") + '</select><select id="myn" aria-label="الاسم"></select><button type="button" class="ph-btn pri sm" id="mysave">حفظ</button></div></div>';
      var d = document.getElementById("myd"), n = document.getElementById("myn");
      function names() { n.innerHTML = P.PH.teams[+d.value].mem.map(function (x, k) { return '<option value="' + k + '">' + E(x) + "</option>"; }).join(""); }
      d.addEventListener("change", names); names();
      document.getElementById("mysave").addEventListener("click", function () { P.me.set({ d: +d.value, idx: +n.value }); me = P.me.get(); draw(); });
      return;
    }
    var my = P.PH.inds.filter(function (i) { return i.d === me.d && i.own === me.idx; }), t = P.totals(my), nm = P.PH.teams[me.d].mem[me.idx], ret = [];
    my.forEach(function (i) { var st = P.sOf(i); i.recs.forEach(function (r) { if (st.st[r] === "returned") ret.push({ code: i.code, rec: r, n: (st.ret[r] || {}).n || "", w: (st.ret[r] || {}).w || "" }); }); });
    if (!myTouched) myOpen = ret.length > 0;
    mysp.innerHTML = '<details class="ph-my"' + (myOpen ? " open" : "") + '><summary><b>مساحتي</b> · ' + E(nm) + ' <span class="ph-chip ok">مرفوعة ' + t.ap + "/" + t.req + "</span>" + (ret.length ? ' <span class="ph-chip ret">أُعيدت إليك ' + ret.length + "</span>" : "") + (t.review ? ' <span class="ph-chip wip">قيد المراجعة ' + t.review + "</span>" : "") + "</summary>" +
      '<div class="ph-mybody"><div class="ph-mystats"><span>اكتمال مؤشراتي <b dir="ltr">' + P.pct(t.p) + '%</b></span><span>بانتظار التعبئة <b>' + t.blank + '</b></span><span>تقارير مرفوعة <b dir="ltr">' + t.repDone + "/" + t.ind + "</b></span></div>" +
      '<div class="ph-myb" role="img" aria-label="اكتمال مؤشراتي ' + P.pct(t.p) + '%"><i style="width:' + P.pct(t.p) + '%"></i></div>' +
      (ret.length ? '<div class="ph-myret"><b>سجلات أعادها المشرف للتعبئة:</b><ul>' + ret.map(function (x) { return '<li><a href="#" data-go="' + E(x.code) + '">' + E(x.code + " · " + x.rec) + "</a> — " + E(x.n) + (x.w ? " (" + E(x.w) + ")" : "") + "</li>"; }).join("") + "</ul></div>" : "") +
      '<p class="ph-mychg"><a href="#" id="mychg">تغيير الاسم</a></p></div></details>';
    var det = mysp.querySelector("details"); det.querySelector("summary").addEventListener("click", function () { myTouched = true; myOpen = !det.open; });
    document.getElementById("mychg").addEventListener("click", function (e) { e.preventDefault(); /* الاسم يُقرأ من عنوان الصفحة أيضاً (?d=&m=) فيُحذف منه قبل المسح وإلا عاد الاسم نفسه */
      try { var u = new URL(location.href); u.searchParams.delete("d"); u.searchParams.delete("m"); history.replaceState(null, "", u.toString()); } catch (x) {}
      P.me.clear(); me = null; myTouched = false; draw(); });
    mysp.querySelectorAll("[data-go]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); focus = a.dataset.go; q.value = ""; fo.value = ""; fd.value = ""; draw(); var el = document.getElementById("i-" + focus); if (el) el.scrollIntoView({ block: "center" }); }); });
  }
  function draw() {
    renderMy();
    var a = P.PH.inds.filter(match), t = P.totals(a);
    sum.textContent = a.length + " مؤشراً · " + t.req + " سجلاً · منشأة " + t.cr + " · مرفوعة (بعد المراجعة) " + t.ap + " · معبّأة قيد المراجعة " + t.review;
    list.innerHTML = a.length ? a.map(function (i) { return P.card(i, { open: i.code === focus }); }).join("") : '<div class="ph-empty">لا توجد مؤشرات تطابق هذا التصفية.</div>';
    if (window.PortalRole) { var els = list.querySelectorAll("[data-roles]"); for (var k = 0; k < els.length; k++) els[k].classList.toggle("pr-off", !!role && els[k].getAttribute("data-roles").split(",").indexOf(role) < 0); }
    if (first && focus) { var el = document.getElementById("i-" + focus); if (el) el.scrollIntoView({ block: "center" }); }
    first = false;
  }
  P.bindCards(list);
  [q, fd, fs, fr, fo].forEach(function (c) { c.addEventListener(c === q ? "input" : "change", function () { focus = ""; draw(); }); });
  mine.addEventListener("click", function () { onlyMine = !onlyMine; mine.setAttribute("aria-pressed", String(onlyMine)); draw(); });
  P.onStatus(draw);
  P.load();
})();
</script>
<script src="page-gate.js" data-lazy="1"></script>
<script src="legal-notice.js"></script>
<script src="content-protect.js"></script>
</body>
</html>
